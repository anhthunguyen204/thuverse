.ob-ic{width:46px;height:46px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 2px}
.ob-ic .ic{width:22px;height:22px}
.ob h2{font:750 22px/1.25 var(--f-ui);letter-spacing:-.02em;margin:0}
.ob>p{margin:-6px 0 4px;font-size:14.5px}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.ob-cell{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.ob-cell>span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-2)}
.ob-cell .ic{width:14px;height:14px}
.ob-cell select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 8px;font:650 15px var(--f-ui);color:var(--text)}
.ob-ov{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed color-mix(in srgb,var(--primary) 45%,var(--border));background:var(--primary-soft);border-radius:12px;padding:10px 14px;text-align:left}
.ob-ov>span:first-child{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:14px;color:var(--primary-ink)}
.ob-ov .ic{width:15px;height:15px}
.ob .tg-ov{flex-direction:column;align-items:flex-end;gap:0}
.ob .tg-ov-v{font-size:24px}
.ob-skip{font-size:13.5px;align-self:center}


/* avatars + profile */
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar .ic{width:55%;height:55%;color:#fff}
.avatar{overflow:hidden}
.avpick{display:flex;gap:14px;align-items:flex-start}
.avpick-prev{width:64px !important;height:64px !important;font-size:24px;flex:none}
.avpick-opts{display:flex;flex-direction:column;gap:10px;min-width:0}
.avpick-grid{display:flex;flex-wrap:wrap;gap:6px}
.avpick-o{border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer;line-height:0}
.avpick-o .avatar{width:34px;height:34px;font-size:14px}
.avpick-o.on{border-color:var(--primary)}
.avpick-o:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.avpick-acts{display:flex;align-items:center;gap:12px}
.avpick-acts label.btn{cursor:pointer}
/* onboarding steps */
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:2px}
.ob-dots i{width:22px;height:4px;border-radius:4px;background:var(--border)}
.ob-dots i.on{background:var(--primary)}.ob-dots i.done{background:color-mix(in srgb,var(--primary) 45%,var(--border))}
.ob .ob-ic .mark{width:46px;height:46px}.ob .ob-ic .mark svg{width:46px;height:46px}
.ob .ob-ic:has(.mark){background:none}
.ob-l{text-align:left}
.ob .avpick{text-align:left}
.ob-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.ob-goals{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.ob-goal input{position:absolute;opacity:0;pointer-events:none}
.ob-goal span{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.ob-goal span .ic{width:16px;height:16px;color:var(--muted)}
.ob-goal input:checked+span{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink)}
.ob-goal input:checked+span .ic{color:var(--primary)}
.ob-goal input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
/* ---------- First-run tour (5 steps). One easing and one duration for every scene. */
.modal.ob2m{max-width:880px;overflow:hidden}
.ob2{--obe:cubic-bezier(.2,.75,.25,1);--obt:.7s;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:480px}
.ob2-art{position:relative;background:var(--surface-2);background-image:radial-gradient(var(--border) 1px,transparent 1.2px);background-size:18px 18px;border-right:1px solid var(--border);overflow:hidden}
.ob2-main{display:flex;flex-direction:column;padding:22px 26px 22px 30px;min-width:0;max-height:min(640px,calc(100dvh - 12vh));overflow:auto}
.ob2-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ob2-prog{display:flex;gap:5px;flex:1}.ob2-prog i{flex:1;height:4px;border-radius:4px;background:var(--border);transition:background .3s var(--obe)}
.ob2-prog i.done{background:color-mix(in srgb,var(--primary) 45%,var(--border))}.ob2-prog i.on{background:var(--primary)}
.ob2-count{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.ob2-body{flex:1;display:flex;flex-direction:column;gap:12px}
.ob2-body h2{font:750 26px/1.2 var(--f-ui);letter-spacing:-.02em;margin:0;outline:none}
.ob2-body>p{margin:0;font-size:15.5px;line-height:1.6;color:var(--text-2);max-width:46ch}
.ob2-body .fld{margin:0}.ob2-body .ob-goals{margin-top:2px}
.ob2-nav{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border-2)}
.ob2-nav .grow{flex:1}.ob2-nav .link{font-size:14px;white-space:nowrap}.ob2-nav .btn{white-space:nowrap}
.ob2 .ob-ielts{text-align:left}
/* scenes */
.obv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.obv [data-a]{animation:obIn var(--obt) var(--obe) both;animation-delay:var(--d,0s)}
@keyframes obIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.obv-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px -18px rgba(20,16,60,.35)}
/* 1 welcome: words in several languages settle around the mark */
.obv1 .obv-ring{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--primary) 30%,var(--border))}
.obv1 .obv-ring.r2{width:330px;height:330px;margin:-165px 0 0 -165px;opacity:.6}
.obv1 .obv-mark .mark,.obv1 .obv-mark svg{width:72px;height:72px}
.obv-at{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)))}
.obv-w{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-weight:650;font-size:14px;white-space:nowrap;box-shadow:0 6px 16px -10px rgba(20,16,60,.3)}
.obv-w small{color:var(--muted);font-weight:500;margin-left:6px;font-size:11.5px}
.obv-w.t{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
/* 2 vocabulary: a word in a sentence becomes a saved card */
.obv2{flex-direction:column;gap:14px;padding:24px}
.obv2 .obv-sent{padding:16px 18px;font:500 16px/1.5 var(--f-serif);max-width:280px}
.obv2 mark{background:linear-gradient(var(--yellow-soft),var(--yellow-soft)) no-repeat 0 100%/0% 100%;color:inherit;padding:0 2px;border-radius:3px;animation:obHi .6s var(--obe) .35s forwards}
@keyframes obHi{to{background-size:100% 100%}}
.obv2 .obv-wc{padding:14px 16px;width:250px}.obv-wc b{font-size:18px}.obv-wc .ipa{margin-left:8px}.obv-wc em{display:block;font-style:normal;color:var(--text-2);font-size:14px;margin-top:4px}
.obv-wc .chip{margin-left:6px;vertical-align:2px}
.obv-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--green);background:var(--green-soft);border-radius:99px;padding:5px 11px}.obv-pill .ic{width:14px;height:14px}
.obv-arrow{width:2px;height:16px;background:var(--border-strong);border-radius:2px}
/* 3 review: a flashcard turns over, reviews spread out */
.obv3{flex-direction:column;gap:22px;padding:24px}
.obv-fc{width:220px;height:136px;perspective:900px}
.obv-fc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:obFlip .8s var(--obe) 1s forwards}
@keyframes obFlip{to{transform:rotateY(180deg)}}
.obv-fc-f,.obv-fc-b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px}
.obv-fc-f b{font-size:22px}.obv-fc-f small{color:var(--muted);font-size:12px}
.obv-fc-b{transform:rotateY(180deg);background:var(--primary-soft);border-color:transparent}.obv-fc-b b{color:var(--primary-ink);font-size:20px}.obv-fc-b small{color:var(--text-2);font-size:13px}
.obv-sr{display:flex;align-items:center;width:250px}
.obv-sr i{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);flex:none;animation:obDot .35s var(--obe) forwards;animation-delay:var(--d)}
.obv-sr span{height:2px;background:var(--border);flex:var(--g);position:relative;overflow:hidden}
.obv-sr span::after{content:"";position:absolute;inset:0;background:var(--primary);transform:scaleX(0);transform-origin:left;animation:obLine .45s var(--obe) forwards;animation-delay:var(--d)}
@keyframes obDot{to{background:var(--primary);border-color:var(--primary)}}@keyframes obLine{to{transform:none}}
.obv-cap{font-size:12.5px;color:var(--muted);margin-top:-12px}
/* 4 explore: places to go */
.obv4 .obv-tiles{display:grid;grid-template-columns:repeat(3,96px);gap:10px}
.obv-tile{height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--text-2);text-align:center;padding:0 6px}
.obv-tile .ic{width:22px;height:22px;color:var(--primary)}
/* 5 space: one workspace per language, each filling up */
.obv5{gap:14px;padding:20px}
.obv-ws{width:150px;padding:14px;display:flex;flex-direction:column;gap:10px}
.obv-ws.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.obv-ws b{font-size:14.5px}.obv-ws b span{margin-right:6px}
.obv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.obv-grid i{aspect-ratio:1;border-radius:4px;background:var(--surface-3);animation:obFill .4s var(--obe) forwards;animation-delay:var(--d)}
@keyframes obFill{to{background:color-mix(in srgb,var(--primary) var(--k),var(--surface-3))}}
@media (max-width:760px){
  .modal.ob2m{max-width:520px}
  .ob2{grid-template-columns:1fr;min-height:0}
  .ob2-art{height:200px;border-right:0;border-bottom:1px solid var(--border)}
  .ob2-main{padding:18px 20px;max-height:none}
  .obv{transform:scale(.6)}.ob2-body h2{font-size:22px}
}
@media (max-width:760px) and (max-height:700px){.ob2-art{height:160px}.obv{transform:scale(.5)}}
@media (prefers-reduced-motion:reduce){
  .obv [data-a],.obv2 mark,.obv-fc-in,.obv-sr i,.obv-sr span::after,.obv-grid i{animation-duration:1ms!important;animation-delay:0s!important}
}
/* ---------- What's new */
.wn-btn{position:relative}
.wn-btn .ic{width:19px;height:19px}
.wn-btn.unread::before{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--bg)}
.wn-btn:hover::after,.wn-btn:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font:600 12.5px/1 var(--f-ui);padding:7px 9px;border-radius:8px;white-space:nowrap;z-index:30;pointer-events:none;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.wn-btn:hover{background:var(--surface-2);color:var(--text)}
.modal.wn{max-width:680px;display:flex;flex-direction:column;max-height:calc(100vh - 12vh);max-height:calc(100dvh - 12vh);overflow:hidden}
.wn{display:flex;flex-direction:column;min-height:0;flex:1}

.wn-head h2{font:750 24px/1.2 var(--f-ui);letter-spacing:-.02em;margin:0}.wn-head p{margin:4px 0 0;color:var(--text-2);font-size:14.5px}

.wn-rel{padding:18px 0 6px;border-bottom:1px solid var(--border-2)}.wn-rel:last-child{border-bottom:0}
.wn-rel>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}

.wn-rel h3{flex-basis:100%;font:700 17px/1.3 var(--f-ui);margin:0}
.wn-new{font-size:11.5px;font-weight:700;color:var(--primary-ink);background:var(--primary-soft);border-radius:99px;padding:2px 8px}[data-theme=dark] .wn-new{color:#cfc8ff}
.wn-g{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-2);margin:14px 0 6px}.wn-g .ic{width:14px;height:14px}
.wn-g.new .ic{color:var(--primary)}.wn-g.improved .ic{color:var(--blue)}.wn-g.fixed .ic{color:var(--green)}

.wn-it{display:flex;gap:16px;align-items:flex-start;padding:8px 0}
.wn-it>div:first-child{flex:1;min-width:0}.wn-it b{font-size:15px}.wn-it p{margin:3px 0 0;font-size:14px;line-height:1.55;color:var(--text-2)}
.wn-pv{flex:none;width:132px;height:84px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.wn-pv img{width:30px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--border)}
.wn-pv.views{flex-direction:column;align-items:stretch;padding:12px 16px;gap:5px}.wn-pv.views i{height:8px;border-radius:3px;background:var(--surface-3)}.wn-pv.views i:first-child{background:color-mix(in srgb,var(--primary) 35%,var(--surface-3));width:70%}
.wn-pv.ws span{font-size:12px;font-weight:650;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 8px}
.wn-pv.ob{flex-direction:column;gap:8px}.wn-pv.ob .mark,.wn-pv.ob svg{width:30px;height:30px}.wn-pv.ob span{display:flex;gap:3px}.wn-pv.ob span i{width:14px;height:3px;border-radius:3px;background:var(--border)}.wn-pv.ob span i:first-child,.wn-pv.ob span i:nth-child(2){background:var(--primary)}
@media (max-width:560px){.wn-it{flex-direction:column;gap:8px}.wn-pv{width:100%;height:72px}.wn-head,.wn-body{padding-left:18px;padding-right:18px}}
.ob-ielts{display:flex;flex-direction:column;gap:8px;text-align:left}

/* ---------- Tarot Corner. Built on the app tokens: neutral surfaces, brand indigo for actions and selection,
   and one accent per position (Past teal, Present indigo, Future coral) carried through both stages. */
.tarot,.trm{--tr-past:#0E9C88;--tr-past-ink:#0A7566;--tr-pres:var(--primary);--tr-pres-ink:var(--primary-ink);--tr-fut:#F0643F;--tr-fut-ink:#B8431F;
  --tr-back:#4B3BE6;--tr-back-2:#3D2DD4;--tr-ease:cubic-bezier(.2,.75,.25,1)}
[data-theme=dark] .tarot,[data-theme=dark] .trm{--tr-past:#2CC7B0;--tr-past-ink:#5FDCC8;--tr-fut:#FF7B5C;--tr-fut-ink:#FF9C82;--tr-back:#4B3BE6;--tr-back-2:#3A2BC4}
[data-pos=past]{--pc:var(--tr-past);--pci:var(--tr-past-ink)}[data-pos=present]{--pc:var(--tr-pres);--pci:var(--tr-pres-ink)}[data-pos=future]{--pc:var(--tr-fut);--pci:var(--tr-fut-ink)}
.tr-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc,var(--primary));flex:none}
.tr-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--pci,var(--text-2))}
/* landing */
.tarot{position:relative}
.tr-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);align-items:center;gap:32px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 40px;overflow:hidden;position:relative}

.tr-intro{position:relative;z-index:1}
.tr-tags{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tarot h1{font:750 34px/1.12 var(--f-ui);letter-spacing:-.025em;margin:0 0 12px;color:var(--text)}
.tr-intro>p{color:var(--text-2);font-size:16px;line-height:1.6;max-width:50ch;margin:0 0 22px}
.tr-cta{font-size:15.5px;padding:12px 20px}

.tr-deck{position:relative;height:260px;z-index:1}
.tr-fan{position:absolute;left:50%;top:14px;width:132px;height:232px;transform:translateX(-50%) rotate(calc((var(--i) - 1) * 10deg)) translateX(calc((var(--i) - 1) * 18px));transform-origin:50% 115%;transition:transform .5s var(--tr-ease)}
.tr-hero:hover .tr-fan{transform:translateX(-50%) rotate(calc((var(--i) - 1) * 14deg)) translateX(calc((var(--i) - 1) * 30px)) translateY(-4px)}
/* the card back: brand indigo, a fine line pattern and a small orbit mark */
.tc-back{display:grid;place-items:center;border-radius:14px;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.07) 9px 10px),linear-gradient(160deg,var(--tr-back),var(--tr-back-2));box-shadow:inset 0 0 0 7px var(--tr-back),inset 0 0 0 8px rgba(255,255,255,.28),0 18px 34px -18px rgba(20,16,60,.55)}

/* saved readings */

/* ---------- content types (fixed, defined by the app) vs collections (made by the user)
   Every entry has exactly one content type (item.type; item.col is kept as the matching section for older versions).
   Collections are user records of kind 'ucol'; an entry lists the collections it belongs to in item.collectionIds,
   so one entry can sit in several collections without being copied. Both are scoped to the active workspace. */
const CONTENT_TYPES = {
  word:{label:'Word', col:'vocabulary', icon:'type'},
  collocation:{label:'Collocation', col:'collocations', icon:'link-2'},
  phrasal:{label:'Phrasal verb', col:'collocations', icon:'corner-down-right'},
  sentence:{label:'Sentence', col:'structures', icon:'text-quote'},
  linking:{label:'Linking phrase', col:'linking', icon:'link'},
  grammar:{label:'Grammar note', col:'grammar', icon:'languages'},
  idiom:{label:'Idiom', col:'idioms', icon:'message-square-quote'},
  mistake:{label:'Mistake', col:'mistakes', icon:'circle-alert'},
};
function typeOf(r){
  if (r && CONTENT_TYPES[r.type] && CONTENT_TYPES[r.type].col === r.col) return r.type;
  if (r && CONTENT_TYPES[r.vtype] && CONTENT_TYPES[r.vtype].col === r.col) return r.vtype;
  const c = r && r.col;
  if (c === 'collocations') return /phrasal verb/i.test(r.pos || '') ? 'phrasal' : 'collocation';

// Revised Romanization, syllable by syllable, with linking and the commonest sound changes (auto-filled; editable)
function romanize(text){
  const I = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
  const V = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
  const F = ['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  const FL = ['','g','kk','ks','n','nj','nh','d','r','lg','lm','lb','ls','lt','lp','lh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];
  const syl = [...String(text || '')].map(c => { const n = c.charCodeAt(0) - 0xAC00; return n >= 0 && n < 11172 ? {i:Math.floor(n / 588), v:Math.floor(n % 588 / 28), f:n % 28} : {raw:c}; });

    const prev = syl[k - 1], next = syl[k + 1];

    if (x.i === 5 && prev && (prev.f === 8 || prev.f === 4)) ini = 'l';            // ㄹㄹ and ㄴㄹ → ll
    if (x.i === 11 && prev && prev.raw === undefined && prev.f && prev.f !== 21 && FL[prev.f].length === 1) ini = FL[prev.f] === 'r' ? 'r' : FL[prev.f];

}

function bump(kind){

  a.days = a.days || {}; a.days[k] = (a.days[k] || 0) + 1;
  if (kind) { a[kind] = a[kind] || {}; a[kind][k] = (a[kind][k] || 0) + 1; }

function dayCounts(){
  const m = {...(activity().days || {})};
  for (const r of all()) {
    if ((r.kind === 'item' || r.kind === 'note') && r.createdAt) { const k = ymd(r.createdAt); m[k] = (m[k]||0) + 1; }
    if (r.kind === 'journal' && r.date) m[r.date] = (m[r.date]||0) + 1;

function streaks(m){
  let d = new Date(); d.setHours(0,0,0,0);
  if (!m[ymd(d)]) d.setDate(d.getDate()-1);
  let cur = 0; while (m[ymd(d)]) { cur++; d.setDate(d.getDate()-1); }
  const keys = Object.keys(m).filter(k => m[k]).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) { const t = parseYmd(k).getTime(); run = (prev !== null && Math.round((t - prev)/DAY) === 1) ? run + 1 : 1; best = Math.max(best, run); prev = t; }
  return {cur, best, today: !!m[ymd()]};
}

/* Spaced repetition (SM-2 style) */
function nextSrs(srs, g){
  const s = {ease:2.5, interval:0, reps:0, lapses:0, ...(srs||{})};
  const now = Date.now();
  if (g === 0) { s.lapses++; s.reps = 0; s.interval = 0; s.ease = Math.max(1.3, s.ease - .2); s.due = now + 10*60e3; }
  else {
    if (g === 1) { s.interval = s.interval ? Math.max(s.interval + 1, Math.round(s.interval * 1.2)) : 1; s.ease = Math.max(1.3, s.ease - .15); }
    else if (g === 2) { s.interval = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.max(s.interval + 1, Math.round(s.interval * s.ease)); }
    else { s.interval = s.reps === 0 ? 4 : s.reps === 1 ? 7 : Math.max(s.interval + 2, Math.round(s.interval * s.ease * 1.3)); s.ease += .15; }
    s.reps++; s.due = addDays(sod(now), s.interval);
  }
  s.last = now;
  return s;
}
const ivLabel = s => s.interval === 0 ? '10 min' : s.interval === 1 ? '1 day' : s.interval < 31 ? s.interval + ' days' : Math.round(s.interval/30) + ' mo';
function applyRating(r, g){
  const n = clone(r);
  n.srs = nextSrs(r.srs, g);
  if (g === 0) { n.difficult = true; if (n.status === 'mastered' || n.status === 'new') n.status = 'learning'; }
  else {
    if (g === 3 || (g === 2 && n.srs.reps >= 3)) n.difficult = false;
    n.status = n.srs.interval >= 21 ? 'mastered' : 'learning';
  }
  n.reviews = (n.reviews || 0) + 1;
  if (!firstStudied(r)) { n.firstStudiedAt = Date.now(); logEvent('studied', n.id); }
  if (n.status === 'mastered' && r.status !== 'mastered') { n.masteredAt = Date.now(); logEvent('mastered', n.id); }
  logEvent('reviewed', n.id);
  Store.put(n); bump('r');
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v){ if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function tipEl(host){ let t = host.querySelector('.ctip'); if (!t) { t = document.createElement('div'); t.className = 'ctip'; t.hidden = true; host.appendChild(t); } return t; }
function setTip(t, value, label, sub){
  t.textContent = ''; const b = document.createElement('b'); b.textContent = value; t.appendChild(b);
  const s = document.createElement('span'); s.textContent = label; t.appendChild(s);
  if (sub) { const x = document.createElement('small'); x.textContent = sub; t.appendChild(x); }
  t.hidden = false;
}
function placeTip(t, host, x, y){
  const w = t.offsetWidth, hw = host.clientWidth;
  t.style.left = Math.max(0, Math.min(hw - w, x - w / 2)) + 'px'; t.style.top = Math.max(0, y - t.offsetHeight - 12) + 'px';
}

function drawGrowth(host, g){
  host.querySelectorAll('svg,.ctip').forEach(n => n.remove());
  const W = Math.max(260, host.clientWidth), H = W > 520 ? 270 : 200, m = {l:36, r:14, t:14, b:26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = g.pts.length;
  const ymax = niceMax(Math.max(...g.pts.map(p => p.v)));
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)), y = v => m.t + ih - v / ymax * ih;
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, 'aria-hidden':'true'}, host);
  [0, ymax / 2, ymax].forEach(v => {
    svgEl('line', {x1:m.l, x2:W - m.r, y1:y(v), y2:y(v), class:'grid'}, svg);
    const tx = svgEl('text', {x:m.l - 8, y:y(v) + 4, 'text-anchor':'end', class:'axis'}, svg); tx.textContent = Math.round(v);
  });
  const ticks = n <= 8 ? [...Array(n).keys()] : [0, Math.round((n - 1) / 2), n - 1];
  ticks.forEach(i => { const tx = svgEl('text', {x:x(i), y:H - 6, 'text-anchor': i === 0 && n > 8 ? 'start' : i === n - 1 && n > 8 ? 'end' : 'middle', class:'axis'}, svg); tx.textContent = n <= 8 ? new Date(g.pts[i].t).toLocaleDateString('en-GB', {weekday:'short'}) : dShort(g.pts[i].t); });
  const pts = g.pts.map((p, i) => `${x(i)},${y(p.v)}`);
  svgEl('path', {d:`M${x(0)},${y(0)} L${pts.join(' L')} L${x(n - 1)},${y(0)} Z`, class:'area'}, svg);
  svgEl('polyline', {points:pts.join(' '), class:'line'}, svg);
  svgEl('circle', {cx:x(n - 1), cy:y(g.pts[n - 1].v), r:4.5, class:'end'}, svg);
  const cross = svgEl('line', {y1:m.t, y2:m.t + ih, class:'cross', visibility:'hidden'}, svg);
  const dot = svgEl('circle', {r:4.5, class:'hot', visibility:'hidden'}, svg);
  const hit = svgEl('rect', {x:m.l - 6, y:0, width:iw + 12, height:H, fill:'transparent'}, svg);
  const tip = tipEl(host);
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(n - 1, i)); const p = g.pts[cur];
    cross.setAttribute('x1', x(cur)); cross.setAttribute('x2', x(cur)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(cur)); dot.setAttribute('cy', y(p.v)); dot.setAttribute('visibility', 'visible');
    setTip(tip, plural(p.v, 'word'), fmtD(p.t), p.add ? `+${p.add} that day` : 'no new words that day');
    placeTip(tip, host, x(cur), y(p.v));
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; cur = -1; };
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); show(Math.round((e.clientX - r.left - m.l) / iw * (n - 1))); });
  hit.addEventListener('pointerleave', hide);
  host.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(cur < 0 ? n - 1 : cur + (e.key === 'ArrowRight' ? 1 : -1)); } };
  host.onfocus = () => show(n - 1); host.onblur = hide;
}

function drawWeek(host, days){
  host.querySelectorAll('svg,.ctip').forEach(n => n.remove());
  const W = Math.max(220, host.clientWidth), H = 130, m = {l:4, r:4, t:8, b:22};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, gw = iw / days.length;
  const ymax = Math.max(1, ...days.map(d => Math.max(d.newN, d.rev)));
  const bw = Math.min(14, (gw - 10) / 2);
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, 'aria-hidden':'true'}, host);
  svgEl('line', {x1:m.l, x2:W - m.r, y1:m.t + ih, y2:m.t + ih, class:'base'}, svg);
  const bar = (cx, v, cls) => { if (!v) return; const h = Math.max(3, v / ymax * ih), x0 = cx, y0 = m.t + ih - h, r = Math.min(3, bw / 2, h);
    svgEl('path', {d:`M${x0},${m.t + ih} L${x0},${y0 + r} Q${x0},${y0} ${x0 + r},${y0} L${x0 + bw - r},${y0} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} L${x0 + bw},${m.t + ih} Z`, class:cls}, svg); };
  const tip = tipEl(host), cols = [];
  days.forEach((d, i) => {
    const cx = m.l + i * gw + gw / 2;
    const bg = svgEl('rect', {x:m.l + i * gw + 2, y:m.t, width:gw - 4, height:ih, rx:4, class:'col'}, svg);
    bar(cx - bw - 1, d.newN, 'b-new'); bar(cx + 1, d.rev, 'b-rev');
    const tx = svgEl('text', {x:cx, y:H - 6, 'text-anchor':'middle', class: i === days.length - 1 ? 'axis today' : 'axis'}, svg);
    tx.textContent = i === days.length - 1 ? 'Today' : new Date(d.t).toLocaleDateString('en-GB', {weekday:'short'});
    cols.push(bg);
  });
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(days.length - 1, i)); const d = days[cur];
    cols.forEach((c, k) => c.classList.toggle('on', k === cur));
    setTip(tip, `${d.newN} new · ${d.rev} reviewed`, new Date(d.t).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'}));
    placeTip(tip, host, m.l + cur * gw + gw / 2, m.t + ih - Math.max(d.newN, d.rev) / ymax * ih);
  };
  const hide = () => { cols.forEach(c => c.classList.remove('on')); tip.hidden = true; cur = -1; };
  const hit = svgEl('rect', {x:0, y:0, width:W, height:H, fill:'transparent'}, svg);
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); show(Math.floor((e.clientX - r.left - m.l) / gw)); });
  hit.addEventListener('pointerleave', hide);
  host.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(cur < 0 ? days.length - 1 : cur + (e.key === 'ArrowRight' ? 1 : -1)); } };
  host.onfocus = () => show(days.length - 1); host.onblur = hide;
}

const TG_SKILLS = [['listening','Listening','headphones'],['reading','Reading','book-open'],['writing','Writing','pen-line'],['speaking','Speaking','mic']];

/* ---------- Library */
function collCard(c, compact){
  const p = colProgress(c), n = c.kind === 'words' ? plural(c.wordIds.length, 'word') : plural(c.lessons.length, 'lesson');
  const done = c.kind === 'words' ? `${p.done} of ${p.total} learned` : `${p.done} of ${p.total} complete`;
  const tone = CAT_TONE[c.cat] || 'indigo';
  const status = p.pct >= 1 ? `<span class="cstat ok">${ic('circle-check')} Finished</span>` : p.done ? `<span class="cstat">${ic('clock')} ${Math.round(p.pct*100)}%</span>` : '';

    <div class="cbody"><span class="eyebrow">${CAT_LABEL[c.cat]}${c.group && c.group !== 'Core' ? ' · ' + esc(c.group) : ''}</span><b>${esc(c.name)}</b><p>${esc(c.desc)}</p>
      <div class="cmeta"><span>${ic(c.kind==='words'?'layers':'list-checks')} ${n}</span><span title="${LEVELS[c.level]||''}">${ic('chart-no-axes-column')} ${c.level}</span><span>${ic('clock')} ${fmtDur(estTime(c))}</span></div>
      <div class="cprog">${pbar(p.pct)}<span>${done}</span></div>

}
function vLibrary(){
  const cat = S.libCat;

    } else if (c.id === 'structures') {

      <button class="btn lg block" data-act="start-review" data-deck="${c.id}" ${dueHere?'':'disabled'}>${ic('repeat-2')} Review ${dueHere} due</button>`

  </div></aside>`;
  if (c.kind === 'lessons') {

    <div class="syl">${c.lessons.map((lid,i) => { const l = LESSONS[lid], s = lessonState(lid), cur = lid === nextLesson;

  const q = S.cQ.trim().toLowerCase();
  const rows = c.wordIds.filter(wid => {

function newCard(wid, known, dueNow){

  return known
    ? {id:'c-' + wid, kind:'card', wid, status:'known', skipped:true, srs:{ease:2.5, interval:120, reps:3, lapses:0, due:addDays(sod(), 120)}, reviews:0, learnedAt:now, createdAt:now, addedAt:now, knownAt:now}

/* =========================================================
   Built-in grammar and sentence-structure libraries.
   The educational content (content.js) is read-only; the person's layer
   (status, saved, notes, own examples) lives in one progress record per
   topic: lp-<lesson> for grammar (existing), sp-<topic> for structures.
   ========================================================= */
const TLEVEL = {basic:'Basic', intermediate:'Intermediate', advanced:'Advanced'};
const TSTAT = {new:['circle-dashed','Not started'], learning:['clock','Learning'], reviewed:['eye','Reviewed'], mastered:['circle-check','Mastered']};
const GGROUPS = [['fund','Grammar fundamentals','blocks'],['tenses','Verb tenses','clock'],['inter','Intermediate grammar','layers'],['adv','Advanced grammar','sparkles']];
const SGROUPS = [['Foundations','blocks'],['Clause patterns','git-merge'],['Advanced patterns','sparkles'],['Expressive patterns','megaphone'],['IELTS patterns','graduation-cap']];
const structState = id => Store.get('sp-' + id) || {status:'new'};
const topicRec = (kind, id) => kind === 'g' ? lessonState(id) : structState(id);
const topicStatus = s => s.mark || (s.status === 'done' ? 'reviewed' : s.status === 'started' ? 'learning' : 'new');
const topicHref = (kind, id) => kind === 'g' ? '#lesson-' + id : '#structure-' + id;
const topicTitle = (kind, id) => (kind === 'g' ? LESSONS[id] : STRUCTS[id] || {}).title || id;
function topicUpdate(kind, id, fn){
  const pid = (kind === 'g' ? 'lp-' : 'sp-') + id;
  const r = clone(Store.get(pid) || (kind === 'g' ? {id:pid, kind:'lesson', lid:id, createdAt:Date.now()} : {id:pid, kind:'structure', sid:id, createdAt:Date.now()}));
  fn(r); Store.put(r);
}
function openStructure(id){
  const s = Store.get('sp-' + id);
  if (!s) Store.put({id:'sp-' + id, kind:'structure', sid:id, status:'started', createdAt:Date.now(), lastOpened:Date.now()});
  else touch('sp-' + id, () => s);
}
const lvlPill = l => l ? `<span class="lvl lvl-${l}">${TLEVEL[l]}</span>` : '';
const statChip = st => st === 'new' ? '' : `<span class="wst ${st === 'mastered' ? 'mastered' : 'learning'}">${ic(TSTAT[st][0])} ${TSTAT[st][1]}</span>`;
function topicMatches(kind, t){
  const q = S.glQ.trim().toLowerCase(), r = topicRec(kind, t.id), st = topicStatus(r);
  if (S.glLevel !== 'all' && t.level !== S.glLevel) return false;
  if (S.glStatus === 'saved' && !r.saved) return false;
  if (!['all','saved'].includes(S.glStatus) && st !== S.glStatus) return false;
  if (q) {
    const hay = kind === 'g' ? [t.title, t.summary, t.vi, ...(t.explain || []), ...(t.form || []).flat(), ...(t.examples || [])] : [t.title, t.summary, t.explain, t.vi, ...t.patterns.flat(2)];
    if (!hay.join(' ').toLowerCase().includes(q)) return false;
  }
  return true;
}
function topicRow(kind, t){
  const r = topicRec(kind, t.id), st = topicStatus(r);
  return `<a class="trow" href="${topicHref(kind, t.id)}"><span class="tile sm t-${kind === 'g' ? 'indigo' : 'amber'}">${ic(kind === 'g' ? 'book-open' : 'quote')}</span>
    <span class="tmain"><b>${esc(t.title)}</b><small>${esc(t.summary)}</small></span>
    <span class="tmeta">${lvlPill(t.level)}${statChip(st)}${r.saved ? `<span class="tsaved" title="Saved">${ic('bookmark-check')}</span>` : ''}</span></a>`;
}
function libFilters(kind){
  const lbl = kind === 'g' ? 'grammar topics' : 'sentence structures';
  return `<div class="toolbar">
    <label class="sbox">${ic('search')}<input class="fsearch" id="glq" type="search" placeholder="Search ${lbl}, e.g. ${kind === 'g' ? 'conditionals' : 'inversion'}" value="${esc(S.glQ)}" data-input="glQ" aria-label="Search ${lbl}"></label>
    <div class="seg" role="group" aria-label="Level">${[['all','All levels'],['basic','Basic'],['intermediate','Intermediate'],['advanced','Advanced']].map(([v,l]) => `<button class="${S.glLevel===v?'on':''}" data-act="gl-level" data-v="${v}">${l}</button>`).join('')}</div>
    <span class="sel">${ic('list-filter')}<select data-change="glStatus" aria-label="Status">${[['all','Any status'],['saved','Saved'],['new','Not started'],['learning','Learning'],['reviewed','Reviewed'],['mastered','Mastered']].map(([v,l]) => `<option value="${v}" ${S.glStatus===v?'selected':''}>${l}</option>`).join('')}</select></span>
  </div>`;
}
function grammarLibraryHTML(){
  const all = Object.values(LESSONS);
  const sections = GGROUPS.map(([g, name, icn]) => {
    const list = all.filter(t => t.group === g).sort((a, b) => COLL[a.col].lessons.indexOf(a.id) - COLL[b.col].lessons.indexOf(b.id)).filter(t => topicMatches('g', t));
    const colId = (all.find(t => t.group === g) || {}).col;
    return list.length ? `<div class="tgroup"><h3 class="sub-h">${ic(icn)} ${name} <span class="muted">${list.length}</span>${colId ? `<a class="link" href="#collection-${colId}">Study in order ${ic('chevron-right')}</a>` : ''}</h3><div class="tlist">${list.map(t => topicRow('g', t)).join('')}</div></div>` : '';
  }).join('');
  return libFilters('g') + (sections || `<div class="empty">${ic('search-x')}<h3>No grammar topics match</h3><button class="btn" data-act="gl-clear">Clear filters</button></div>`)
    + `<p class="muted lib-own">${ic('pencil-line')} Found a rule that isn’t here? <button class="link" data-act="new" data-type="item" data-col="grammar">Create a custom grammar note</button></p>`;
}
function structureLibraryHTML(banks){
  const all = Object.values(STRUCTS);
  const sections = SGROUPS.map(([g, icn]) => {
    const list = all.filter(t => t.group === g && topicMatches('s', t));
    return list.length ? `<div class="tgroup"><h3 class="sub-h">${ic(icn)} ${g} <span class="muted">${list.length}</span></h3><div class="tlist">${list.map(t => topicRow('s', t)).join('')}</div></div>` : '';
  }).join('');
  return libFilters('s') + (sections || `<div class="empty">${ic('search-x')}<h3>No sentence structures match</h3><button class="btn" data-act="gl-clear">Clear filters</button></div>`)
    + `<h3 class="sub-h">${ic('library')} Phrase banks <span class="muted">learn and review as flashcards</span></h3><div class="colls">${banks.map(x => collCard(x)).join('')}</div>`
    + `<p class="muted lib-own">${ic('pencil-line')} Have your own pattern? <button class="link" data-act="new" data-type="item" data-col="structures">Create a custom sentence structure</button></p>`;
}
/* the person's layer on a built-in topic: status, saved, notes, own examples */
function topicPersonalTop(kind, id){
  const r = topicRec(kind, id), st = topicStatus(r);

/* ---------- Appearance: light / dark / system. Light is the default until someone chooses.
   Saved in the account's settings record (theme, themeAt) so it follows the person;
   a small local copy ({mode, at, owner}) applies it instantly on the next load.
   at = 0 means "never chosen" and always reads as Light. */
const THEME_KEY = 'thuverse.theme';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const THEME_LBL = {light:'Light', dark:'Dark', system:'System'}, THEME_DEF = 'light';
const THEME_ACCTS = 'thuverse.theme.accts';                       // per-account copies, so a sign-in on this browser shows the right theme at once
function themeLocal(){
  try { const j = JSON.parse(localStorage.getItem(THEME_KEY) || 'null'); if (j && THEME_LBL[j.mode]) return j.at ? j : {...j, mode:THEME_DEF, at:0}; if (j) return {mode:THEME_DEF, at:0, owner:j.owner || null}; } catch {}
  const legacy = lsGet('englishHub.theme');                       // older versions kept only light/dark here
  return THEME_LBL[legacy] ? {mode:legacy, at:1, owner:null} : {mode:THEME_DEF, at:0, owner:null};
}
const themeSave = o => lsSet(THEME_KEY, JSON.stringify(o));
const themeMode = () => document.documentElement.dataset.themeMode || THEME_DEF;
function themeAccts(){ try { const o = JSON.parse(localStorage.getItem(THEME_ACCTS) || '{}'); return o && typeof o === 'object' ? o : {}; } catch { return {}; } }
function themeRemember(owner, mode, at){ if (!owner || !at) return; const o = themeAccts(); o[owner] = {mode, at}; lsSet(THEME_ACCTS, JSON.stringify(o)); }
/* Signing out: keep this account's choice for its next sign-in here, and show the default meanwhile. */
function themeSignedOut(uid){
  const loc = themeLocal(); if (uid && loc.owner === uid) themeRemember(uid, loc.mode, loc.at);
  themeSave({mode:THEME_DEF, at:0, owner:null}); applyTheme(THEME_DEF);
}
/* Signing in: if this browser already knows the account's choice, show it straight away (the account copy is checked once it loads). */
function themeSignedIn(uid){
  const loc = themeLocal(); if (loc.owner === uid) return;
  const k = themeAccts()[uid];
  if (k && THEME_LBL[k.mode]) { themeSave({mode:k.mode, at:k.at, owner:uid}); applyTheme(k.mode); }
  else if (loc.owner) { themeSave({mode:THEME_DEF, at:0, owner:uid}); applyTheme(THEME_DEF); }   // never inherit another account's choice
}
/* the signed-in account whose settings are loaded, or null */
const themeAcct = () => Store.mode === 'cloud' ? (Web.uid || (isClaude() ? 'claude' : null)) : null;
function applyTheme(mode){
  const t = mode === 'dark' || mode === 'light' ? mode : (sysDark.matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t; document.documentElement.dataset.themeMode = mode;
}
function setTheme(mode){
  if (!THEME_LBL[mode]) return;
  const at = Date.now(), owner = Web.uid || (isClaude() ? 'claude' : null);
  themeSave({mode, at, owner}); themeRemember(owner, mode, at); applyTheme(mode);
  const st = settings(); if (st.theme !== mode) Store.put({...clone(st), theme:mode, themeAt:at});
  render();
}
/* Reconcile the account's saved choice with this device's: the newer explicit choice wins.
   A choice made before signing in is carried into the account; another account's choice never is. */
function themeReconcile(){
  const owner = themeAcct(); if (!owner) return;
  const st = settings(), loc = themeLocal(), accAt = st.themeAt || 0;
  const mine = !loc.owner || loc.owner === owner;
  if (st.theme && THEME_LBL[st.theme] && (accAt >= loc.at || !mine)) {
    if (loc.mode !== st.theme || loc.owner !== owner || loc.at !== accAt) { themeSave({mode:st.theme, at:accAt, owner}); themeRemember(owner, st.theme, accAt); }
    if (themeMode() !== st.theme) applyTheme(st.theme);
  } else if (loc.at > accAt && mine) {
    Store.put({...clone(st), theme:loc.mode, themeAt:loc.at}); themeSave({...loc, owner}); themeRemember(owner, loc.mode, loc.at);
  } else if (!st.theme && !mine) {
    themeSave({mode:THEME_DEF, at:0, owner}); applyTheme(THEME_DEF);
  } else if (!st.theme && !loc.at && themeMode() !== THEME_DEF) applyTheme(THEME_DEF);
}
sysDark.addEventListener('change', () => { if (themeMode() === 'system') { applyTheme('system'); render(); } });

function vLesson(){
  const l = LESSONS[S.lessonId];
  if (!l) return `<div class="empty">${ic('languages')}<h3>Lesson not found</h3><a class="btn" href="#library-grammar">Back to grammar</a></div>`;
  const c = COLL[l.col], s = lessonState(l.id), idx = c.lessons.indexOf(l.id);
  const prev = c.lessons[idx-1], next = c.lessons[idx+1];
  if (!S.lq || S.lq.lid !== l.id) S.lq = {lid:l.id, answers:{}};
  const ans = S.lq.answers, answered = Object.keys(ans).length, score = l.quiz.filter((q,i) => ans[i] === q[2]).length;
  const need = Math.ceil(l.quiz.length * .75);
  return `<div class="lesson">
  <div class="crumb"><a href="#library">Library</a>${ic('chevron-right')}<a href="#library-grammar">Grammar</a>${ic('chevron-right')}<a href="#collection-${c.id}">${esc(c.name)}</a>${ic('chevron-right')}<span>${idx+1} of ${c.lessons.length}</span></div>

  <p class="lede" style="margin-bottom:8px">${esc(l.summary)}</p>
  <div class="tphead">${lvlPill(l.level)}<span class="muted">${s.status==='done'?'Practice passed':'Practice not passed yet'}${s.best!==undefined?` · best ${s.best}/${l.quiz.length}`:''}</span></div>
  ${topicPersonalTop('g', l.id)}
  <h2 class="si">${ic('lightbulb')} How it works</h2><div class="txt">${l.explain.map(p => `<p>${fmt(p)}</p>`).join('')}</div>
  <h2 class="si">${ic('table')} Form</h2><table class="formt"><tbody>${l.form.map(([a,b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table>
  <h2 class="si">${ic('quote')} Examples</h2><ul class="exlist">${l.examples.map(e => `<li><button class="icon-btn" data-act="speak" data-t="${esc(e)}" aria-label="Listen">${ic('volume-2')}</button>${esc(e)}</li>`).join('')}</ul>
  ${l.vi ? `<h2 class="si">${ic('languages')} Giải thích tiếng Việt</h2><div class="txt vi-exp"><p>${fmt(l.vi)}</p></div>` : ''}
  <h2 class="si">${ic('triangle-alert')} Common mistakes</h2><div class="mist">${l.mistakes.map(([w,r,why]) => `<div><span class="w">${esc(w)}</span><br><span class="r">${ic('check')} ${esc(r)}</span><small>${esc(why)}</small></div>`).join('')}</div>
  <h2 class="si">${ic('list-checks')} Practice</h2>
  ${l.quiz.map((q,i) => { const a = ans[i];
    return `<div class="q"><p>${i+1}. ${esc(q[0])}</p><div class="qopts">${q[1].map((o,j) => `<button class="qopt ${a!==undefined && j===q[2]?'right':''} ${a===j && j!==q[2]?'wrong':''}" data-act="lq" data-q="${i}" data-o="${j}" ${a!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    ${a!==undefined ? `<div class="qfb">${a===q[2] ? '<b style="color:var(--leaf)">Correct.</b>' : '<b style="color:var(--pen)">Not quite.</b>'} ${esc(q[3])}</div>` : ''}</div>`; }).join('')}
  ${answered === l.quiz.length ? `<div class="score"><div><b style="font:600 20px var(--f-serif)">${score} of ${l.quiz.length} correct</b><div style="font-size:14.5px">${score >= need ? 'Lesson complete. Come back in a few days and try the practice again.' : `Get ${need} right to complete the lesson.`}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="lq-reset">${ic('rotate-ccw')} Try again</button>${next ? `<a class="btn primary" href="#lesson-${next}">Next lesson ${ic('chevron-right')}</a>` : `<a class="btn primary" href="#collection-${c.id}">Back to ${esc(c.name)}</a>`}</div></div>` : ''}
  ${relatedStructs(l.id).length ? `<h2 class="si">${ic('link')} Related sentence patterns</h2><div class="relchips">${relChips('s', relatedStructs(l.id))}</div>` : ''}
  ${topicPersonalNotes('g', l.id)}
  <div class="lnav">${prev ? `<a class="btn ghost" href="#lesson-${prev}">${ic('chevron-left')} ${esc(LESSONS[prev].title)}</a>` : '<span></span>'}${s.status !== 'done' ? `<button class="btn ghost" data-act="lesson-done" data-id="${l.id}">${ic('check')} Mark as complete</button>` : ''}${next ? `<a class="btn ghost" href="#lesson-${next}">${esc(LESSONS[next].title)} ${ic('chevron-right')}</a>` : '<span></span>'}</div>
  </div>`;
}
function openLesson(lid){
  const s = Store.get('lp-' + lid);
  if (!s) Store.put({id:'lp-' + lid, kind:'lesson', lid, status:'started', createdAt:Date.now(), lastOpened:Date.now()});
  else touch('lp-' + lid, () => s);
  touchCol(LESSONS[lid].col);
}
function answerLesson(qi, oi){
  const l = LESSONS[S.lq.lid]; if (!l || S.lq.answers[qi] !== undefined) return;
  S.lq.answers[qi] = oi;
  if (Object.keys(S.lq.answers).length === l.quiz.length) {
    const score = l.quiz.filter((q,i) => S.lq.answers[i] === q[2]).length;
    const s = clone(Store.get('lp-' + l.id) || {id:'lp-' + l.id, kind:'lesson', lid:l.id, createdAt:Date.now()});
    const was = s.status;
    s.best = Math.max(s.best || 0, score); s.last = score; s.lastOpened = Date.now();
    if (score >= Math.ceil(l.quiz.length * .75)) { s.status = 'done'; if (s.mark !== 'mastered') s.mark = 'reviewed'; } else if (s.status !== 'done') s.status = 'started';
    if (s.status === 'done' && was !== 'done') { s.completedAt = Date.now(); toast('Lesson complete'); }
    Store.put(s); bump('n');
  } else render();
}

function bdHelpMatch(text){
  const t = ' ' + text.toLowerCase().replace(/[?!.,]/g, ' ').replace(/\s+/g, ' ') + ' ';
  let best = null, bs = 0;
  const skip = isKo() ? ['ielts','library','colpv','linking','grammar'] : ['topik'];
  for (const h of BD_HELP) { if (skip.includes(h.id)) continue; let s = 0; for (const k of h.k) if (t.includes(k)) s += k.length; if (s > bs) { bs = s; best = h; } }
  return bs >= 4 ? best : null;
}

const BD_PARTICLES = ['up','down','out','off','on','in','over','away','back','through','around','about','along','across','by','into','after','forward','apart','together'];
const bdClean = s => String(s || '').trim().replace(/^["“'‘]+|["”'’]+$/g, '').replace(/[?.!]+$/, '').trim();
const bdTermOk = s => !!s && s.length <= 60 && s.split(/\s+/).length <= 6 && /^[\p{L}][\p{L}\p{M}' \-]*$/u.test(s);
const BD_NOT_TERM = /\b(my|app|page|library|collection|collections|review|dashboard|setting|settings|thuverse|flashcards?|progress|grammar library|journal|lumi)\b/i;

  if ((m = s.match(/^(?:hãy\s+|giúp mình\s+|giúp tôi\s+)?(?:thêm|lưu|bỏ)\s+(?:từ\s+|cụm từ\s+)?["“]?(.+?)["”]?\s+vào\s+(?:bộ sưu tập\s+|mục\s+|chủ đề\s+|danh sách\s+)?(.+)$/i)) && bdTermOk(bdClean(m[1]))) return {t:'save', term:bdClean(m[1]), target:m[2]};
  if ((m = s.match(/^(?:please\s+)?(?:add|save)\s+(?:the\s+word\s+|the\s+phrase\s+)?["“]?([^"”]+?)["”]?$/i)) && bdTermOk(bdClean(m[1])) && !/^(a|an|new)\b/i.test(m[1]) && !BD_NOT_TERM.test(m[1])) return {t:'save', term:bdClean(m[1]), target:''};
  if ((m = s.match(/^(?:thêm|lưu)\s+(?:từ\s+|cụm từ\s+)["“]?(.+?)["”]?$/i)) && bdTermOk(bdClean(m[1]))) return {t:'save', term:bdClean(m[1]), target:''};
  if ((m = s.match(/\bcollocations?\s+(?:for|with|of|using)\s+["“]?(.+?)["”]?$/i)) || (m = s.match(/\b(?:collocation|cụm từ đi với|từ đi với)\s+(?:cho|với|của)?\s*["“]?(.+?)["”]?$/i))) { const w = bdClean(m[1]); if (bdTermOk(w)) return {t:'col', term:w}; }

  const tries = [/^(?:please\s+|can you\s+)?(?:look\s*up|define|check|search for|find)\s+(?:the\s+)?(?:word|phrase|phrasal verb|meaning of)?\s*["“]?(.+?)["”]?$/i,
    /^what(?:'s| is| does)\s+(?:the\s+)?(?:meaning of\s+|word\s+)?["“]?(.+?)["”]?(?:\s+mean)?$/i, /^meaning of\s+["“]?(.+?)["”]?$/i, /^["“]?(.+?)["”]?\s+meaning$/i,

}

function bdResolveTarget(raw){
  const name = String(raw || '').replace(/(^|\s)(my|the|collection|collections|list|topic|section|bộ sưu tập|chủ đề|mục|danh sách|của mình|của tôi)(?=\s|$)/gi, ' ').replace(/\s+/g, ' ').trim();
  const t = name.toLowerCase();
  if (!t) return {};
  for (const [col, words] of Object.entries(BD_COLWORDS)) if (words.includes(t)) return {col};
  const topics = bdTopics(), exact = topics.find(x => x.toLowerCase() === t);
  if (exact) return {topic:exact};
  const near = topics.filter(x => { const a = x.toLowerCase(); return a.includes(t) || t.includes(a) || (a.length > 4 && t.length > 4 && a.slice(0, 5) === t.slice(0, 5)); });
  if (near.length === 1) return {topic:near[0]};
  if (near.length > 1) return {ask:near.slice(0, 5), name};
  return {topic:name.slice(0, 40).replace(/^./, c => c.toUpperCase()), isNew:true};
}

async function bdLookup(term, mode){
  const m = bdPush({role:'bot', kind:'lookup', term, mode, lk:{word:term}});
  try {
    const mcp = await lkInit();
    if (!mcp) { m.lk = {err:bdT('noLookup')}; return bdUpdate(m); }
    const o = await lkLookup(term, part => { m.lk = part; bdUpdate(m); });
    m.lk = o; bdUpdate(m);
    return m;
  } catch (e) { m.lk = {err:(e && e.code === 'sign_in_required' && e.message) || bdT('lookupErr')}; bdUpdate(m); }
}
function bdFieldsFrom(term, lk, target){
  const mm = (lk && lk.m) || {}, col = target.col || bdGuessCol(term);
  return {term, ipa:(mm.ipaUK && mm.ipaUK.value) || (mm.ipaAny && mm.ipaAny.value) || '', ipaUS:(mm.ipaUS && mm.ipaUS.value) || '', pos:bdIsPhrasal(term) ? 'phrasal verb' : (mm.pos && mm.pos.value) || '',
    def:(mm.def && mm.def.value) || '', vi:(mm.vi && mm.vi.value) || '', examples:(mm.ex && mm.ex.value || []).slice(0, 2).join('\n'),
    synonyms:(mm.syn && mm.syn.value || []).slice(0, 6), antonyms:(mm.ant && mm.ant.value || []).slice(0, 4), collocations:(mm.col && mm.col.value || []).slice(0, 6).map(x => typeof x === 'string' ? x : x.p).filter(Boolean),
    related:(mm.rel && mm.rel.value || []).slice(0, 6).map(x => typeof x === 'string' ? x : x.word || x.p || '').filter(Boolean),
    col:BD_SAVE_COLS.includes(col) ? col : 'vocabulary', topic:target.topic || '', sources:mm.sources || [], at:lk && lk.at};
}
async function bdSaveFlow(term, targetRaw, lk){

  if (ex) return bdSay(bdT('dup', ex.term, COLS[ex.col].label), {chips:[['item:' + ex.id, bdT('view')]]});
  const target = bdResolveTarget(targetRaw);
  if (target.ask) return bdSay(bdT('pickTopic', target.name), {chips:[...target.ask.map(t => [`pick:${JSON.stringify({term, topic:t})}`, t]), [`pick:${JSON.stringify({term, topic:target.name, isNew:true})}`, bdT('noneOfThese')]]});
  if (!lk) {
    BUDDY.busy = true; bdRenderMsgs();
    try { if (await lkInit()) lk = await lkLookup(term); } catch {}
    BUDDY.busy = false;
  }
  const f = bdFieldsFrom(term, lk, target);
  bdPush({role:'bot', kind:'save', f, note:target.isNew && target.topic ? bdT('newTopic', target.topic) : ''});
}

  const vtype = f.col === 'vocabulary' ? 'word' : f.col === 'collocations' ? (bdIsPhrasal(f.term) ? 'phrasal' : 'collocation') : f.col === 'linking' ? 'linking' : '';
  const rec = {id:newId(), kind:'item', createdAt:now, srs:{ease:2.5, interval:0, reps:0, lapses:0, due:now}, reviews:0,
    col:f.col, term:f.term, ipa:f.ipa, ipaUS:f.ipaUS || '', pos:f.pos, vi:f.vi, def:f.def, examples:f.examples, synonyms:list(f.synonyms), antonyms:list(f.antonyms), collocations:list(f.collocations), related:list(f.related),
    context:'', category:'', tags:[], ielts:[], notes:'', status:'new'};
  rec.type = typeOf({col:f.col, pos:vtype === 'phrasal' ? 'phrasal verb' : f.pos, type:vtype});
  const uc = f.topic ? ucolCreate(f.topic) : null; rec.collectionIds = uc ? [uc.id] : [];

}

const bdAiOn = () => !isClaude() && !!(Web.cfg && Web.cfg.ai);
async function bdAsk(text){

  BUDDY.busy = true; bdRenderMsgs();
  let token = ''; try { const {data} = await Web.sb.auth.getSession(); token = (data && data.session && data.session.access_token) || ''; } catch {}
  const history = BUDDY.msgs.filter(m => m.text && (m.role === 'user' || !m.kind)).slice(-9, -1).map(m => ({role:m.role === 'user' ? 'user' : 'assistant', text:String(m.text).slice(0, 1500)}));
  const its = items();
  const ctx = {page:S.view, lang:BUDDY.lang, collections:Object.keys(COLS).map(c => ({name:COLS[c].label, count:its.filter(r => r.col === c).length})), topics:bdTopics().slice(0, 15)};
  let r, b = null;
  try {
    r = await fetch('/api/buddy', {method:'POST', headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body:JSON.stringify({message:text, history, context:ctx}), signal:AbortSignal.timeout(30000)});
    b = await r.json().catch(() => null);
  } catch {}
  BUDDY.busy = false;
  if (!r || !b) return bdSay(bdT('aiErr'));
  if (r.status === 429) return bdSay(bdT('aiBusy'));
  if (b.error === 'ai_not_configured') { Web.cfg.ai = false; return bdAsk(text); }
  if (!r.ok || typeof b.reply !== 'string') return bdSay(bdT('aiErr'));
  const go = [], chips = [];
  (Array.isArray(b.actions) ? b.actions : []).slice(0, 4).forEach(a => {
    if (a && a.type === 'open' && bdPageOk(a.page)) go.push(a.page);
    else if (a && a.type === 'add') go.push('add');
    else if (a && a.type === 'lookup' && bdTermOk(bdClean(a.term))) chips.push(['lookup:' + bdClean(a.term), (BUDDY.lang === 'vi' ? 'Tra ' : 'Look up ') + bdClean(a.term)]);
  });

}
async function bdHandle(text){
  text = String(text || '').trim().slice(0, 1000); if (!text || BUDDY.busy) return;
  BUDDY.lang = bdLangOf(text); bdLabels();
  bdPush({role:'user', text});
  const wait = BUDDY.wait; BUDDY.wait = null;
  if (wait && isKo()) return bdSay(bdT('koLookup'), {go:['add']});
  if (wait && bdTermOk(bdClean(text)) && !bdHelpMatch(text)) return wait === 'col' ? bdLookup(bdClean(text), 'col') : bdLookup(bdClean(text));
  const it = bdIntent(text);
  if (isKo() && it && (it.t === 'lookup' || it.t === 'col')) return bdSay(bdT('koLookup'), {go:['add']});
  if (isKo() && it && it.t === 'save') { itemForm(null, {col:'vocabulary', term:it.term}); return bdSay(bdT('koSave', it.term)); }
  if (it && it.t === 'lookup') return bdLookup(it.term);
  if (it && it.t === 'col') return bdLookup(it.term, 'col');
  if (it && it.t === 'save') return bdSaveFlow(it.term, it.target);
  if (it && it.t === 'page') return bdPageHelp();
  const h = bdHelpMatch(text);
  if (h) return bdHelp(h);
  return bdAsk(text);
}

function sentenceAround(text, sel){
  const i = text.toLowerCase().indexOf(sel.toLowerCase()); if (i < 0) return '';
  let s = i, e = i + sel.length;
  while (s > 0 && !/[.!?\n]/.test(text[s-1])) s--;
  while (e < text.length && !/[.!?\n]/.test(text[e])) e++;
  return text.slice(s, Math.min(text.length, e + 1)).trim();
}

function sparkline(sc, target){
  const W = 300, H = 70, p = 6, lo = 4, hi = 9;
  const y = b => H - p - (Math.max(lo, Math.min(hi, b)) - lo) / (hi - lo) * (H - 2*p);
  const ty = y(target);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--pen)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  const pts = sc.slice(-12);
  if (pts.length) {
    const x = i => pts.length === 1 ? W/2 : p + i * (W - 2*p) / (pts.length - 1);
    s += `<polyline fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((r,i)=>x(i)+','+y(r.band)).join(' ')}"/>`;
    s += pts.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.band)}" r="3.5" fill="${i===pts.length-1?'var(--surface)':'var(--primary)'}" stroke="var(--primary)" stroke-width="1.5"/>`).join('');
  }
  return s + '</svg>';
}

const norm = s => String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const canType = v => v.term && !/[…]|\.\.\./.test(v.term) && v.term.length <= 32 && (v.vi || v.def) && !v.mistake;
function blankEx(ex, term){
  if (!ex) return '';

  return rx.test(ex) ? esc(ex.replace(rx, '\u0000')).replace(/\u0000/g, '<span class="blank">_____</span>') : '';
}
function stepValid(s, st){

function sessionAct(kind, el){
  const s0 = Store.get('session'); if (!s0) return;
  const s = clone(s0), cur = curStep(s), step = s.steps[cur]; if (!step) return;
  const ui = S.ui || (S.ui = {});
  if (kind === 'learn' || kind === 'known') {
    if (step.t !== 'learn') return;
    if (!cardOf(step.wid)) Store.put(newCard(step.wid, kind === 'known'));
    s.steps[cur].done = true;
    if (kind === 'learn') { s.tally.learned++; bump('n'); } else s.tally.known++;
    return advance(s, cur);
  }
  if (kind === 'mc') {
    if (step.t !== 'mc' || ui.picked !== null && ui.picked !== undefined) return;
    ui.picked = Number(el.dataset.o);
    if (ui.picked === ui.right) s.tally.right++; else { s.tally.wrong++; s.fails[step.key] = 1; requeue(s, step); }
    scheduleAfterQuiz(s, step.key, cur);
    sessionSave(s); return render();
  }
  if (kind === 'type' || kind === 'giveup') {
    if (ui.typed) return;
    const r = Store.get(step.key), v = wv(r);
    const val = kind === 'giveup' ? '' : ($('#typein') || {}).value || '';
    const a = norm(val), b = norm(v.term);
    const ok = !!a && (a === b || (b.length > 4 && lev(a, b) <= 1));
    ui.typed = {val, ok, almost: ok && a !== b};
    if (step.t === 'rev') ui.grade = ok ? 2 : 0;
    else { if (ok) s.tally.right++; else { s.tally.wrong++; s.fails[step.key] = 1; requeue(s, step); } scheduleAfterQuiz(s, step.key, cur); }
    sessionSave(s); return render();
  }
  if (kind === 'override') { if (ui.typed) { ui.typed.ok = true; ui.grade = 2; } return render(); }
  if (kind === 'flip') { if (!ui.flipped) { ui.flipped = true; render(); } return; }
  if (kind === 'rate') {
    const g = Number(el.dataset.g), r = Store.get(step.key);
    applyRating(r, g); s.tally.reviewed++;
    if (g === 0) requeue(s, step);

}

function setStatusSrs(rec, s, isNew){
  if (s === 'mastered') { rec.masteredAt = Date.now(); logEvent('mastered', rec.id); }

}

function journalToVocab(id){
  const j = Store.get(id); if (!j) return;
  let added = 0, skipped = 0;
  const existing = new Set(items().filter(r => VOCAB_COLS.includes(r.col)).map(r => termKey(r.term)));
  lines(j.newVocab).forEach(l => {
    const m = l.split(/\s+[—–-]\s+|\s*:\s+|\t/);
    const term = (m[0]||'').trim(), vi = m.slice(1).join(' — ').trim();
    if (!term) return;
    if (existing.has(termKey(term))) { skipped++; return; }
    existing.add(termKey(term));
    const now = Date.now() + added;
    const nid = newId(); logEvent('added', nid);
    Store.put({id:nid, kind:'item', col:'vocabulary', term, vi, def:'', examples:'', ipa:'', context:'Journal, ' + fmtD(j.date), category:'', tags:[], ielts:[], notes:'', status:'new', createdAt:now, reviews:0, srs:{ease:2.5, interval:0, reps:0, lapses:0, due:now}});
    added++;
  });
  toast(added ? `Saved ${plural(added,'word')} to Vocabulary${skipped?`; ${skipped} already there`:''}` : 'All of these words are already in your Vocabulary');
}

/* =========================================================
   Speech
   ========================================================= */
function speak(t){
  try {
    if (!('speechSynthesis' in window)) throw 0;
    const lang = isKo() ? 'ko-KR' : settings().accent || 'en-GB';
    const u = new SpeechSynthesisUtterance(String(t).replace(/…/g,', '));
    u.lang = lang; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase() === lang.toLowerCase());
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch { toast('Your browser can’t read text aloud here.', true); }
}

function exportData(){
  const json = JSON.stringify({app:'english-hub', version:1, exportedAt:new Date().toISOString(), records:all()}, null, 1);
  const area = $('#io-area');
  const done = () => toast('Backup copied. Paste it into a note or file to keep it safe.');
  try { navigator.clipboard.writeText(json).then(done, () => showJson()); } catch { showJson(); }
  function showJson(){ if (area) { area.innerHTML = `<p class="muted" style="font-size:14px;margin:0 0 6px">Copying isn’t allowed here. Select all of the text below and copy it.</p><textarea class="code" readonly>${esc(json)}</textarea>`; area.querySelector('textarea').select(); } }
}
function importOpen(){
  $('#io-area').innerHTML = `<div class="stack"><textarea class="code" id="imp-text" placeholder="Paste a backup here, or choose a file below"></textarea>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="file" id="imp-file" accept=".json,application/json"><button class="btn primary" data-act="import-run">Import</button></div></div>`;
  $('#imp-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) f.text().then(t => $('#imp-text').value = t); });
}
function importRun(){
  try {
    const data = JSON.parse($('#imp-text').value);
    const recs = Array.isArray(data) ? data : data.records;
    if (!Array.isArray(recs)) throw new Error();
    let n = 0;
    recs.forEach(r => { if (r && r.id && r.kind && /^[A-Za-z0-9_\-.~:@+]+$/.test(r.id)) { Store.put(clone(r)); n++; } });
    $('#io-area').innerHTML = ''; toast(`Imported ${plural(n,'record')}`);
  } catch { toast('That isn’t a valid backup. Paste the full text you copied from “Copy backup”.', true); }
}

      en:a.fallback ? '' : a.en, vi:a.fallback ? '' : a.vi, vocab:a.vocab.map(v => ({term:v.term, pos:v.pos, def:v.def, vi:v.vi, example:v.example, context:v.context, lookup:!!v.lookup})), createdAt:Date.now()};
    Store.put(rec); TAR.savedId = rec.id; render(); toast('Reading saved. Find it in Tarot Corner under Saved readings.'); const f = $('#trm .trm-saved') || $('#trm [data-act=tarot-new]'); if (f && f.tagName === 'BUTTON') f.focus({preventScroll:true});
  },
  'tarot-open': el => {
    const r = Store.get(el.dataset.id); if (!r || r.kind !== 'tarot') return;
    Object.assign(TAR, {cards:r.cards.map(c => ({...c})), shown:[true, true, true], status:'done', why:r.source === 'ai' ? '' : 'saved', sel:new Set(), savedId:r.id,
      ai:r.source === 'ai' ? {en:r.en, vi:r.vi, vocab:r.vocab} : {fallback:true, vocab:r.vocab}});
    trmOpen('read');
  },
  'tarot-del': async el => { if (await confirmBox('Delete this reading?', 'Words you saved from it stay in your library.', 'Delete')) { Store.del(el.dataset.id); toast('Reading deleted'); } },
  'uc-new': () => ucolNameForm(null),
  'uc-rename': el => { const c = ucolById(el.dataset.id); if (c) ucolNameForm(c); },
  'uc-del': async el => {
    const c = ucolById(el.dataset.id); if (!c) return;
    const n = itemsIn(c.id).length;
    if (!await confirmBox(`Delete “${c.name}”?`, n ? `The collection is removed. Its ${plural(n, 'entry', 'entries')} stay in My Collections, under their content type.` : 'This collection is empty.', 'Delete collection')) return;
    itemsIn(c.id).forEach(r => Store.put({...clone(r), collectionIds:(r.collectionIds || []).filter(x => x !== c.id)}));
    Store.del(c.id); toast('Collection deleted'); go('collections');
  },
  'uc-type': el => { S.ucType = el.dataset.v; render(); },
  'uc-clear': () => { S.ucType = ''; S.ucQ = ''; render(); },
  'lm-link': () => loginLink(),
  'lm-unlink': async el => {
    const ids = LOGIN.ids || [], g = ids.find(i => (i.identity_id || i.id) === el.dataset.id);
    if (!g || ids.length < 2) { toast('Google is your only login method, so it can’t be disconnected.', true); return; }
    if (!await confirmBox('Disconnect Google?', 'You’ll sign in with your email and password instead. Your profile and learning data stay as they are.', 'Disconnect')) return;
    const {error} = await Web.sb.auth.unlinkIdentity(g);

    LOGIN.ids = null; loginLoad(true);
  },
  'tscore-del': async el => { if (await confirmBox('Delete this practice test?', 'Its scores will be removed from your TOPIK history.', 'Delete')) { Store.del(el.dataset.id); toast('Practice test deleted'); } },
  'r-src-clear': () => { S.rSrc = ''; render(); },
  'src-cat': el => { S.srcCat = el.dataset.v; render(); },
  'src-clear': () => { S.srcQ = ''; S.srcCat = ''; S.srcLang = ''; render(); },
  'src-new': () => sourceForm(null),
  'src-edit': el => { const r = Store.get(el.dataset.id); if (r && r.kind === 'source') sourceForm(r); },
  'src-del': async el => { const r = Store.get(el.dataset.id); if (r && r.kind === 'source' && await confirmBox('Remove this source?', `“${r.name}” will be removed from your sources. Articles you saved from it stay in your reading list.`, 'Remove')) { Store.del(r.id); toast('Source removed'); } },
  'src-arts': el => { S.rSrc = el.dataset.id; S.rFilter = 'all'; go('reading'); },
  'a-status': el => { const a = Store.get(el.dataset.id); if (a) { const n = clone(a); n.status = el.dataset.v; Store.put(n); } },
  'a-edit': el => articleForm(Store.get(el.dataset.id)),
  'a-del': async el => { const a = Store.get(el.dataset.id); if (a && await confirmBox('Delete this article?', `“${a.title}” will be removed. Words you saved from it stay in My Collections.`)) { Store.del(a.id); toast('Article deleted'); go('reading'); } },
  'save-sel': () => saveSelection(),
  'rv-style': el => { Store.put({...clone(settings()), reviewStyle:el.dataset.v}); },
  's-learn': el => sessionAct('learn', el), 's-known': el => sessionAct('known', el), 's-mc': el => sessionAct('mc', el),
  's-next': el => sessionAct('next', el), 's-flip': (el, e) => { if (!e.target.closest('button')) sessionAct('flip', el); }, 's-rate': el => sessionAct('rate', el),
  's-giveup': el => sessionAct('giveup', el), 's-override': el => sessionAct('override', el),
  's-home': () => { studyClose(); go('dashboard'); },
  's-exit': () => { const open = !!Store.get('session'); studyClose(); if (open) toast('Session saved — resume it from the dashboard'); },
  's-finish': () => { const s0 = Store.get('session'); if (s0) { S.summary = {...s0.tally, label:s0.label}; Store.del('session'); } },
  'k-pop': el => { const v = el.dataset.v; if (KPOP.open === v) { KPOP.open = ''; $('#kpop').hidden = true; el.setAttribute('aria-expanded', 'false'); } else kPop(v); },
  'k-view': el => { S.kView = el.dataset.v; lsSet('thuverse.kView', S.kView); render(); },
  'k-st': el => { S.kStatuses = kStats().filter(x => x !== el.dataset.v); render(); },
  'k-set': el => { S[el.dataset.k] = el.dataset.v; render(); },
  'k-tag': el => { S.kTag = S.kTag === el.dataset.v ? '' : el.dataset.v; render(); },
  'k-more': () => { S.kLimit += 150; render(); },
  'gl-level': el => { S.glLevel = el.dataset.v; render(); },
  'gl-clear': () => { S.glQ = ''; S.glLevel = 'all'; S.glStatus = 'all'; render(); },
  'tp-mark': el => topicUpdate(el.dataset.k, el.dataset.id, r => { const v = el.dataset.v; r.mark = v; r.markedAt = Date.now(); if (v === 'learning') { if (r.status !== 'done') r.status = 'started'; } else { if (r.status !== 'done') r.completedAt = Date.now(); r.status = 'done'; } }),
  'tp-save': el => { let on; topicUpdate(el.dataset.k, el.dataset.id, r => { r.saved = on = !r.saved; r.savedAt = Date.now(); }); toast(on ? 'Saved to My Collections' : 'Removed from My Collections'); },
  'k-clear': () => { Object.assign(S, {kQ:'', kStatuses:[], kTag:'', kLink:'any', kSort:'new', ucType:'', kLimit:150}); render(); },
  'sk-tab': el => { S.skillTab = el.dataset.v; S.topic = ''; render(); },
  topic: el => { S.topic = el.dataset.v; render(); },
  'edit-note': el => noteForm(Store.get(el.dataset.id)),
  'del-note': async el => { const r = Store.get(el.dataset.id); if (r && await confirmBox('Delete this note?', `“${r.title}” will be removed.`)) { Store.del(r.id); toast('Note deleted'); } },
  'goto-note': el => { const r = Store.get(el.dataset.id); if (!r) return; S.skill = r.skill; S.skillTab = r.section; S.topic = ''; S.search = ''; $('#gsearch').value = ''; go('ielts-' + r.skill); setTimeout(() => { const n = document.getElementById('note-' + r.id); if (n) { n.scrollIntoView({block:'center'}); n.style.outline = '3px solid var(--hl)'; setTimeout(() => n.style.outline = '', 1800); const d = n.querySelector('details'); if (d) d.open = true; } }, 60); },
  'goto-journal': el => { S.jSel = el.dataset.id; S.search = ''; $('#gsearch').value = ''; go('journal'); },
  'del-score': async el => { if (await confirmBox('Delete this score?', 'It will be removed from your progress chart.')) Store.del(el.dataset.id); },
  'rv-dir': el => { S.rv.reverse = el.dataset.v === '1'; render(); },
  'start-review': el => startReviewDeck(el.dataset.deck),
  'pick-journal': el => { S.jSel = el.dataset.id; render(); },
  'edit-journal': el => { const r = el.dataset.id && Store.get(el.dataset.id); journalForm(r || null); },
  'del-journal': async el => { if (await confirmBox('Delete this journal entry?', 'This can’t be undone.')) { Store.del(el.dataset.id); S.jSel = null; toast('Journal entry deleted'); } },
  'journal-vocab': el => journalToVocab(el.dataset.id),
  export: () => exportData(),
  'import-open': () => importOpen(),
  'import-run': () => importRun(),
  starter: () => loadStarter(),
  'remove-samples': async () => { if (await confirmBox('Remove example entries?', 'Only the examples are removed. Anything you added or edited stays.', 'Remove')) { all().filter(r => r.sample).forEach(r => Store.del(r.id)); toast('Examples removed'); } },
  wipe: async () => { if (await confirmBox('Delete all your data?', 'Every entry, note, score and journal entry will be deleted. Copy a backup first if you might want it later.', 'Delete everything')) { all().forEach(r => Store.del(r.id)); toast('All data deleted'); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');

  if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || el.dataset.act !== 'close-nav') e.preventDefault();
  if (el.dataset.act === 'close-nav') { closeModal(); return; }
  fn(el, e);
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input','textarea','select'].includes(tag) || e.target.isContentEditable;
  const modal = !!$('#modal-root').firstElementChild || TRM.open || SET.open;
  if (e.key === 'Escape') {
    if (modal) { closeModal(); return; }
    if (S.search) { S.search = ''; $('#gsearch').value = ''; $('#gsearch').blur(); render(); return; }
    if (S.study) { ACT['s-exit'](); return; }
  }
  const studying = S.study && !modal && Store.get('session');
  if (studying && !(typing && e.target.id !== 'typein')) {
    const sess = Store.get('session'), step = sess.steps[curStep(sess)], ui = S.ui || {};
    if (step) {
      const k = e.key;
      if (step.t === 'learn' && k === 'Enter') { e.preventDefault(); return sessionAct('learn'); }
      if (step.t === 'mc') {
        if ((ui.picked === null || ui.picked === undefined) && ['1','2','3','4'].includes(k)) { e.preventDefault(); return sessionAct('mc', {dataset:{o:Number(k)-1}}); }
        if (ui.picked !== null && ui.picked !== undefined && (k === 'Enter' || k === ' ')) { e.preventDefault(); return sessionAct('next'); }
      }
      if (ui.typed && (k === 'Enter') && e.target.id !== 'typein') { e.preventDefault(); return sessionAct('next'); }
      if (step.t === 'rev' && ui.mode === 'flip') {
        if (!ui.flipped && (k === ' ' || k === 'Enter')) { e.preventDefault(); return sessionAct('flip'); }
        if (ui.flipped && ['1','2','3','4'].includes(k)) { e.preventDefault(); return sessionAct('rate', {dataset:{g:Number(k)-1}}); }
      }
    }
    if (e.target.id === 'typein') return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (typing || modal || S.study || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#gsearch').focus(); }
  else if (e.key === 'n') { e.preventDefault(); itemForm(null, {col: S.view === 'knowledge' && COLS[S.kCol] ? S.kCol : 'vocabulary'}); }
  else if (e.key === 'r' && dueItems().length && S.view !== 'study') { e.preventDefault(); startReviewDeck('due'); }
});
document.addEventListener('submit', e => { if (e.target.id === 'typeform') { e.preventDefault(); sessionAct('type'); } });
/* Reading: select text to save a word */
function hideSel(){ const b = document.getElementById('selbtn'); if (b) b.remove(); }
function selText(){ const sel = window.getSelection(); if (!sel || sel.isCollapsed) return null; const box = $('#rtext'); if (!box || !box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) return null; const t = sel.toString().replace(/\s+/g,' ').trim().replace(/^[^\w']+|[^\w']+$/g,''); return t && t.length <= 60 && t.split(' ').length <= 7 ? {t, rect: sel.getRangeAt(0).getBoundingClientRect()} : null; }
function showSel(){
  hideSel(); if (S.view !== 'article') return;
  const s = selText(); if (!s) return;
  const b = document.createElement('button'); b.id = 'selbtn'; b.className = 'btn primary sm'; b.dataset.act = 'save-sel'; b.dataset.t = s.t;
  b.innerHTML = `${ic('plus')} Save “${esc(s.t.length > 24 ? s.t.slice(0,24) + '…' : s.t)}”`;
  b.style.left = Math.max(8, Math.min(window.innerWidth - 220, s.rect.left)) + 'px'; b.style.top = Math.max(8, s.rect.top - 44) + 'px';
  document.body.appendChild(b); drawIcons();
}
function saveSelection(){
  const b = document.getElementById('selbtn'); const a = Store.get(S.artId); if (!b || !a) return;
  const term = b.dataset.t; hideSel();
  itemForm(null, {col: term.split(' ').length > 1 ? 'collocations' : 'vocabulary', term, examples: sentenceAround(a.text || '', term), context: a.title + (a.source ? ' (' + a.source + ')' : ''), category: a.topic || '', articleId: a.id});
}
document.addEventListener('mouseup', e => { if (e.target.closest('#selbtn')) return; setTimeout(showSel, 10); });
document.addEventListener('keyup', e => { if (e.shiftKey && S.view === 'article') showSel(); });
document.addEventListener('scroll', () => hideSel(), true);
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.hasAttribute('data-fb')) { IMG_BAD.add(t.getAttribute('src')); t.remove(); } }, true);
document.addEventListener('focusout', e => { if (e.target.id === 'a-notes') { const a = Store.get(e.target.dataset.id); if (a && (a.notes||'') !== e.target.value) { const n = clone(a); n.notes = e.target.value; Store.put(n); toast('Notes saved'); } } });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k) { S[k] = e.target.value; S.kLimit = 150; render(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.change;
  if (k) { S[k] = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'tp-form') { e.preventDefault(); const f = e.target, v = Object.fromEntries(new FormData(f)); topicUpdate(f.dataset.k, f.dataset.id, r => { r.notes = String(v.notes || '').trim(); r.myExamples = String(v.myExamples || '').trim(); r.notesAt = Date.now(); }); toast('Notes saved'); return; }
  if (e.target.id === 'tg-form') { e.preventDefault(); const t = tgFromForm(e.target); S.tgEdit = false; Store.put({...clone(settings()), ieltsTargets:t}); toast('IELTS targets saved'); return; }
  if (e.target.id === 'dict-form') { e.preventDefault(); SET.dirty = false; SET.body = ''; const k = new FormData(e.target).get('mwKey') || ''; Store.put({...clone(settings()), mwKey:String(k).trim()}); toast(k ? 'Key saved' : 'Key removed'); return; }
  if (e.target.id !== 'pref-form' && e.target.id !== 'prof-form') return;
  e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)), up = {};
  if ('name' in v) up.name = v.name.trim();
  if ('avatar' in v) up.avatar = String(v.avatar || '');
  if ('target' in v) up.target = Number(v.target);
  if ('examDate' in v) up.examDate = v.examDate;
  if ('accent' in v) up.accent = v.accent;
  if ('dailyNew' in v) up.dailyNew = Number(v.dailyNew) || 10;
  if ('reviewStyle' in v) up.reviewStyle = v.reviewStyle || 'mix';
  Store.put({...clone(settings()), ...up}); SET.dirty = false; SET.body = '';
  toast(e.target.id === 'prof-form' ? 'Profile saved' : 'Preferences saved');
});
$('#gsearch').addEventListener('input', e => srQuery(e.target.value));
$('#gsearch').addEventListener('focus', e => { if (e.target.value.trim() && SR.res && !S.search) srShow(true); });
$('#gsearch').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!SR.open && e.target.value.trim()) srQuery(e.target.value, true); e.preventDefault(); srMove(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Enter') { e.preventDefault(); const a = SR.open && SR.active >= 0 && document.querySelectorAll('#srpop .sr-opt')[SR.active]; if (a) a.click(); else srOpenAll(); }
  else if (e.key === 'Escape' && SR.open) { e.preventDefault(); e.stopPropagation(); srShow(false); }
});
document.addEventListener('mousedown', e => { if (SR.open && !e.target.closest('.top .search')) srShow(false); });
document.addEventListener('click', e => { const a = e.target.closest('#srpop [data-sr]'); if (!a) return; if (a.dataset.act !== 'sr-all') { srShow(false); $('#gsearch').blur(); } });
window.addEventListener('hashchange', route);

/* =========================================================
   Boot
   ========================================================= */
window.drawIcons = drawIcons;
(function boot(){
  initSidebar();
  applyTheme(themeLocal().mode);
  Store.loadLocal();
  setMode('starting');
  route();
  Store.connect();
  try { speechSynthesis.getVoices(); } catch {}
})();
