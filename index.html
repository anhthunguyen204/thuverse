/* =========================================================
   Standalone website mode (Vercel + Supabase)
   On claude.ai the page uses Claude's storage and connectors (unchanged).
   On its own site it reads /api/config, signs in with Supabase Auth and
   keeps every record in the Supabase "records" table (one row per record,
   body = the record as JSON). Dictionary lookups go to /api/lookup.
   ========================================================= */
const Web = {cfg:null, sb:null, uid:null, email:'', mirror:new Map(), listeners:[], lastPull:0, chan:null};
const isClaude = () => !!(window.claude && typeof window.claude.use === 'function');
async function webConfig(){
  if (Web.cfg !== null) return Web.cfg;
  try {
    if (!/^https?:$/.test(location.protocol)) throw 0;
    const r = await fetch('/api/config', {cache:'no-store'});
    const j = r.ok ? await r.json() : null;
    Web.cfg = j && j.app === 'thuverse' ? j : false;
  } catch { Web.cfg = false; }
  return Web.cfg;
}
function loadScript(src){
  return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el); });
}
async function webClient(){
  if (Web.sb) return Web.sb;
  if (!window.supabase) {
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'); }
    catch { await loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'); }
  }
  Web.sb = window.supabase.createClient(Web.cfg.supabaseUrl, Web.cfg.supabaseAnonKey, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  return Web.sb;
}
const webErr = e => {
  const msg = String((e && (e.message || e.error_description)) || e || '');
  const err = new Error(msg || 'Request failed');
  err.code = (!navigator.onLine || /fetch|network|timeout|Load failed/i.test(msg)) ? 'unavailable'
    : /quota|exceed|too large|disk/i.test(msg) ? 'quota_exceeded'
    : /JWT|token|auth/i.test(msg) ? 'auth' : 'error';
  return err;
};
function webEmit(){
  const docs = [...Web.mirror].map(([id, b]) => ({id, exists:true, data:() => b}));
  Web.listeners.forEach(cb => cb({docs, metadata:{fromCache:false}}));
}
async function webPull(){
  const out = new Map(); let from = 0;
  for (;;) {
    const {data, error} = await Web.sb.from('records').select('id,body').eq('user_id', Web.uid).order('id').range(from, from + 999);
    if (error) throw webErr(error);
    data.forEach(r => out.set(r.id, r.body || {}));
    if (data.length < 1000) break;
    from += 1000;
  }
  Web.mirror = out; Web.lastPull = Date.now();
  return out;
}
/* the same small interface Store already uses on claude.ai: doc(id).set/delete and onSnapshot */
const webCollection = {
  doc(id){ return {
    async set(body){
      const {error} = await Web.sb.from('records').upsert({user_id:Web.uid, id, kind:String(body.kind || ''), body, updated_at:new Date().toISOString()}, {onConflict:'user_id,id'});
      if (error) throw webErr(error);
      Web.mirror.set(id, body);
    },
    async delete(){
      const {error} = await Web.sb.from('records').delete().eq('user_id', Web.uid).eq('id', id);
      if (error) throw webErr(error);
      Web.mirror.delete(id);
    },
  }; },
  onSnapshot(cb, onErr){
    Web.listeners = [cb];
    webEmit();
    Web.chan = Web.sb.channel('records-' + Web.uid)
      .on('postgres_changes', {event:'*', schema:'public', table:'records'}, p => {
        const row = p.eventType === 'DELETE' ? p.old : p.new;
        if (!row || row.user_id !== Web.uid || !row.id) return;
        if (p.eventType === 'DELETE') Web.mirror.delete(row.id); else Web.mirror.set(row.id, row.body || {});
        webEmit();
      })
      .subscribe();
    Web.onErr = onErr;
    return () => { try { Web.sb.removeChannel(Web.chan); } catch {} };
  },
};
async function webRefresh(force){
  if (!Web.uid || (!force && Date.now() - Web.lastPull < 20000)) return;
  try { await webPull(); webEmit(); setMode('cloud'); Store.pending.forEach(id => { if (!Store.timers.has(id) && !Store.busy.has(id)) Store.queue(id); }); }
  catch (e) { setMode('error'); }
}
async function webStart(session){
  const sb = Web.sb, uid = session.user.id;
  if (Web.uid === uid) return;
  Web.uid = uid; Web.email = session.user.email || '';
  authHide();
  // The browser cache belongs to one account. Another account's cache is dropped;
  // a cache made before signing in (no owner) is uploaded into this account.
  if (Store.owner && Store.owner !== uid) { Store.recs.clear(); Store.dirty.clear(); Store.pending.clear(); }
  const adopt = !Store.owner && Store.recs.size > 0;
  setMode('syncing');
  try { await webPull(); Web.fresh = Web.mirror.size === 0 && !adopt; }
  catch (e) { Store.owner = uid; Store.saveLocal(); setMode('error'); scheduleRender(); return; }
  if (adopt) for (const [id, r] of Store.recs) { const c = Web.mirror.get(id); if (!c || (r.updatedAt || 0) > (c.updatedAt || 0)) { Store.pending.add(id); Store.dirty.add(id); } }
  Store.owner = uid;
  Store.col = webCollection;
  syncOAuthProfile(session.user);
  Store.pending.forEach(id => Store.queue(id));
  webCollection.onSnapshot(snap => { Store.apply(snap); setMode(navigator.onLine ? 'cloud' : 'error'); }, () => setMode('error'));
  if (Web.fresh && !settings().onboarding) setTimeout(() => { if (Web.uid === uid && !settings().onboarding) onboardShow(); }, 500);
  if (adopt && Store.pending.size) toast(`Uploading ${plural(Store.pending.size, 'record')} from this browser to your account`);
}
/* First time a Google user arrives: copy name and photo into the existing settings record,
   but only into empty fields, and only once (later changes in Preferences are kept). */
function syncOAuthProfile(user){
  const md = (user && user.user_metadata) || {}, prov = ((user && user.app_metadata) || {}).providers || [];
  if (!prov.includes('google')) return;
  const st = settings(); if (st.oauthProfileAt) return;
  const name = String(md.full_name || md.name || '').trim().slice(0, 40), pic = String(md.avatar_url || md.picture || '');
  const up = {oauthProfileAt:Date.now()};
  if (!String(st.name || '').trim() && name) up.name = name;
  if (!st.avatar && /^https:\/\/[^\s"'<>]+$/.test(pic)) up.avatar = pic;
  Store.put({...clone(st), ...up});
}
async function webConnect(){
  const cfg = await webConfig();
  if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) return false;
  let sb;
  try { sb = await webClient(); } catch { setMode('error'); toast('Couldn’t load the sign-in library. Check your connection and reload.', true); return true; }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { authShow('reset'); return; }
    if (session && session.user) setTimeout(() => webStart(session), 0);
    else if (ev === 'SIGNED_OUT') authShow('in');
  });
  const cb = authCallbackInfo();
  const {data} = await sb.auth.getSession();          // also finishes any ?code= exchange from an email link
  if (cb.any) history.replaceState(null, '', location.pathname + (cb.routeHash || ''));
  if (data && data.session) await webStart(data.session);
  else {
    setMode('starting');
    if (cb.error) { AUTH.msg = cb.error; AUTH.err = true; }
    else if (cb.code) { AUTH.msg = 'Your email is confirmed. This link was opened in a different browser from the one you signed up in, so sign in here to continue.'; AUTH.err = false; }
    authShow('in');
  }
  addEventListener('online', () => webRefresh(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') webRefresh(false); });
  return true;
}
async function webSignOut(){
  if (!Web.sb) return;
  if (Store.pending.size && !await confirmBox('Sign out now?', `${plural(Store.pending.size, 'change')} haven’t reached your account yet and will be lost on this device.`, 'Sign out')) return;
  try { Web.sb.removeChannel(Web.chan); } catch {}
  Web.uid = null; Web.mirror = new Map(); Store.col = null;
  Store.recs.clear(); Store.dirty.clear(); Store.pending.clear(); Store.owner = null;
  try { localStorage.removeItem(LS_KEY); } catch {}
  await Web.sb.auth.signOut();
  authShow('in'); scheduleRender();
}

/* Email links come back to the site root as ?code=… (success) or with error=…
   in the query or the hash. Read them before the hash router or supabase-js touch them. */
function authCallbackInfo(){
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const get = k => q.get(k) || h.get(k) || '';
  const code = q.get('code') || '', ec = get('error_code'), ed = get('error_description'), er = get('error');
  const hashIsAuth = /(^|&)(error|error_code|error_description|access_token|code)=/.test(location.hash.replace(/^#/, ''));
  let error = '';
  if ((er === 'access_denied' && !/otp|expired/i.test(ec + ' ' + ed)) || /cancel/i.test(ed)) error = 'Google sign-in was cancelled. You can try again, or sign in with your email and password.';
  else if (er || ec || ed) error = /expired|otp_expired|invalid|not found/i.test(ec + ' ' + ed)
    ? 'That email link has expired or was already used. If you already confirmed your email, just sign in. Otherwise choose “Resend confirmation email”.'
    : `The email link didn’t work (${(ed || er || ec).replace(/\+/g, ' ')}). Sign in, or ask for a new link.`;
  return {code, error, any: !!(code || error || hashIsAuth), routeHash: hashIsAuth ? '' : location.hash};
}

/* ---------- Sign-in backdrop: a pixel-art city at twilight, drawn on a small canvas and scaled up.
   Dusk deepens into evening over the first minute while windows switch on; lights shimmer softly.
   ~10 frames a second, paused when hidden; a single still frame when reduced motion is on. */
const authSky = (() => {
  let cv, cx, raf = 0, t0 = 0, last = 0, W = 0, H = 0, scene = null, onResize = null, still = false;

  const LAYERS = [
    {dusk:'#9c86d6', night:'#3b2d74', hMin:.26, hMax:.46, wMin:10, wMax:26, lit:.18, haze:.0},
    {dusk:'#6a51ad', night:'#2a1f5c', hMin:.18, hMax:.36, wMin:12, wMax:30, lit:.32, haze:.0},
    {dusk:'#3a2a72', night:'#170f38', hMin:.10, hMax:.24, wMin:14, wMax:34, lit:.45, haze:.0},
  ];
  const WARM = ['#ffd38a', '#ffbf7a', '#ffe2a8', '#f7a8cf', '#cdb9ff'];
  function build(){
    const r = rnd(7331), base = Math.min(W, H * 1.8);
    const layers = LAYERS.map((L, li) => {
      const blds = [], wins = [];
      let x = -4 - Math.floor(r() * 8);
      while (x < W + 4) {
        const w = Math.round(L.wMin + r() * (L.wMax - L.wMin)), h = Math.round(base * (L.hMin + r() * (L.hMax - L.hMin)) * (H > W ? 1.25 : 1));
        const top = H - h, b = {x, w, top, ant:r() < .25 ? Math.round(3 + r() * 7) : 0, step:r() < .3 ? Math.round(2 + r() * 4) : 0};
        blds.push(b);
        const cols = Math.floor((w - 3) / 3), rows = Math.floor((h - 4) / (li === 2 ? 4 : 3));
        for (let cI = 0; cI < cols; cI++) for (let rI = 0; rI < rows; rI++) {
          if (r() > L.lit + .25) continue;
          wins.push({x:x + 2 + cI * 3, y:top + 3 + b.step + rI * (li === 2 ? 4 : 3), w:li === 2 ? 2 : 1, h:li === 2 ? 2 : 1, c:WARM[Math.floor(r() * WARM.length)], on:r(), ph:r() * 6.28, sp:.4 + r() * 1.2, fl:r() < .03});
        }

      }
      return {L, blds, wins};
    });
    const stars = [...Array(Math.round(W * H / 260))].map(() => ({x:Math.floor(r() * W), y:Math.floor(r() * H * .55), ph:r() * 6.28, sp:.3 + r() * .9, big:r() < .08}));
    const clouds = [...Array(5)].map((_, i) => ({x:r() * W, y:Math.round(H * (.1 + r() * .32)), w:Math.round(26 + r() * 36), sp:.6 + r() * 1.4, tone:i % 2}));
    const moon = {x:Math.round(W * .8), y:Math.round(H * .16), r:Math.max(7, Math.round(Math.min(W, H) * .05))};
    // crescent cut out on its own little canvas, so the sky shows through the shadowed side
    const mi = document.createElement('canvas'); mi.width = mi.height = moon.r * 2 + 2; const mc = mi.getContext('2d');
    mc.fillStyle = '#f4ecff'; mc.beginPath(); mc.arc(moon.r + 1, moon.r + 1, moon.r, 0, 6.29); mc.fill();
    mc.globalCompositeOperation = 'destination-out'; mc.beginPath(); mc.arc(moon.r + 1 - moon.r * .5, moon.r + 1 - moon.r * .25, moon.r * .92, 0, 6.29); mc.fill();

  }
  function size(){
    if (!cv) return;
    W = Math.max(150, Math.min(400, Math.round(innerWidth / 4))); H = Math.max(110, Math.round(W * innerHeight / innerWidth));
    cv.width = W; cv.height = H; cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false; build(); draw(still ? 50 : (performance.now() - t0) / 1000);
  }
  // a stepped pixel cloud: a wide base and two rounded puffs on top
  function cloud(x, y, w, c){ const h = Math.max(3, Math.round(w / 8)); cx.fillStyle = c;

    const p1 = Math.round(w * .2), p2 = Math.round(w * .48);
    cx.fillRect(x + p1 + 1, y - h, Math.round(w * .3) - 2, h); cx.fillRect(x + p1, y - h + 1, Math.round(w * .3), h - 1);
    cx.fillRect(x + p2 + 1, y - Math.round(h * 1.6), Math.round(w * .26) - 2, h); cx.fillRect(x + p2, y - Math.round(h * 1.6) + 1, Math.round(w * .26), h); }

  e.preventDefault();
  const f = e.target, email = f.elements.email ? f.elements.email.value.trim() : '', pw = f.elements.password ? f.elements.password.value : '';

  if (f.elements.email && !/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');

    if (r && r.error) {

      return fail(/invalid login/i.test(m) ? 'That email and password don’t match. Try again or reset your password.'
        : /not confirmed/i.test(m) ? 'Confirm your email first: open the link we sent you, then sign in. No email? Choose “Resend confirmation email”.'

        : m || 'Something went wrong. Try again.');
    }
    AUTH.busy = false; AUTH.err = false;
    if (AUTH.mode === 'up' && !(r.data && r.data.session)) { AUTH.msg = 'Check your inbox and open the confirmation link. It brings you back here signed in.'; authShow('in'); }
    else if (AUTH.mode === 'link') { AUTH.msg = 'Check your inbox for the sign-in link. Open it on this device.'; authShow(); }
    else if (AUTH.mode === 'forgot') { AUTH.msg = 'Check your inbox for the reset link.'; authShow('in'); }
    else if (AUTH.mode === 'resend') { AUTH.msg = 'If that email has an unconfirmed account, a new confirmation link is on its way.'; authShow('in'); }
    else if (AUTH.mode === 'reset') { authHide(); toast('Password updated'); }
  } catch (err) { fail('Can’t reach the sign-in service. Check your connection and try again.'); }
}, true);

   Store: per-person cloud database, with a browser cache

  async connect(){

      if (!uid) { clearTimeout(giveUp); setMode('local'); return; }

      this.pending.forEach(id => this.queue(id));
      let first = true;
      this.col.onSnapshot(snap => {
        clearTimeout(giveUp);
        this.apply(snap);
        if (!snap.metadata.fromCache) setMode('cloud');

        first = false;
      }, err => {
        clearTimeout(giveUp);
        setMode('error');

    } catch (e) { clearTimeout(giveUp); setMode('local'); }

  apply(snap){
    const m = new Map();

  const s = {ease:2.5, interval:0, reps:0, lapses:0, ...(srs||{})};

  else {
    if (g === 1) { s.interval = s.interval ? Math.max(s.interval + 1, Math.round(s.interval * 1.2)) : 1; s.ease = Math.max(1.3, s.ease - .15); }
    else if (g === 2) { s.interval = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.max(s.interval + 1, Math.round(s.interval * s.ease)); }
    else { s.interval = s.reps === 0 ? 4 : s.reps === 1 ? 7 : Math.max(s.interval + 2, Math.round(s.interval * s.ease * 1.3)); s.ease += .15; }
    s.reps++; s.due = addDays(sod(now), s.interval);

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v){ if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function tipEl(host){ let t = host.querySelector('.ctip'); if (!t) { t = document.createElement('div'); t.className = 'ctip'; t.hidden = true; host.appendChild(t); } return t; }
function setTip(t, value, label, sub){
  t.textContent = ''; const b = document.createElement('b'); b.textContent = value; t.appendChild(b);
  const s = document.createElement('span'); s.textContent = label; t.appendChild(s);
  if (sub) { const x = document.createElement('small'); x.textContent = sub; t.appendChild(x); }

function placeTip(t, host, x, y){
  const w = t.offsetWidth, hw = host.clientWidth;
  t.style.left = Math.max(0, Math.min(hw - w, x - w / 2)) + 'px'; t.style.top = Math.max(0, y - t.offsetHeight - 12) + 'px';

function drawGrowth(host, g){
  host.querySelectorAll('svg,.ctip').forEach(n => n.remove());
  const W = Math.max(260, host.clientWidth), H = W > 520 ? 270 : 200, m = {l:36, r:14, t:14, b:26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = g.pts.length;
  const ymax = niceMax(Math.max(...g.pts.map(p => p.v)));
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)), y = v => m.t + ih - v / ymax * ih;
  const svg = svgEl('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`, 'aria-hidden':'true'}, host);

    svgEl('line', {x1:m.l, x2:W - m.r, y1:y(v), y2:y(v), class:'grid'}, svg);
    const tx = svgEl('text', {x:m.l - 8, y:y(v) + 4, 'text-anchor':'end', class:'axis'}, svg); tx.textContent = Math.round(v);
  });
  const ticks = n <= 8 ? [...Array(n).keys()] : [0, Math.round((n - 1) / 2), n - 1];
  ticks.forEach(i => { const tx = svgEl('text', {x:x(i), y:H - 6, 'text-anchor': i === 0 && n > 8 ? 'start' : i === n - 1 && n > 8 ? 'end' : 'middle', class:'axis'}, svg); tx.textContent = n <= 8 ? new Date(g.pts[i].t).toLocaleDateString('en-GB', {weekday:'short'}) : dShort(g.pts[i].t); });
  const pts = g.pts.map((p, i) => `${x(i)},${y(p.v)}`);
  svgEl('path', {d:`M${x(0)},${y(0)} L${pts.join(' L')} L${x(n - 1)},${y(0)} Z`, class:'area'}, svg);
  svgEl('polyline', {points:pts.join(' '), class:'line'}, svg);
  svgEl('circle', {cx:x(n - 1), cy:y(g.pts[n - 1].v), r:4.5, class:'end'}, svg);
  const cross = svgEl('line', {y1:m.t, y2:m.t + ih, class:'cross', visibility:'hidden'}, svg);
  const dot = svgEl('circle', {r:4.5, class:'hot', visibility:'hidden'}, svg);
  const hit = svgEl('rect', {x:m.l - 6, y:0, width:iw + 12, height:H, fill:'transparent'}, svg);
  const tip = tipEl(host);
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(n - 1, i)); const p = g.pts[cur];
    cross.setAttribute('x1', x(cur)); cross.setAttribute('x2', x(cur)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(cur)); dot.setAttribute('cy', y(p.v)); dot.setAttribute('visibility', 'visible');

function drawWeek(host, days){

/* IELTS target: a personal goal the user sets, kept apart from measured progress */
const TG_SKILLS = [['listening','Listening','headphones'],['reading','Reading','book-open'],['writing','Writing','pen-line'],['speaking','Speaking','mic']];
const TG_BANDS = Array.from({length:19}, (_, i) => (i / 2).toFixed(1));     // 0.0 … 9.0
/* IELTS overall: mean of the four skills, rounded to the nearest half band;
   .25 rounds up to .5 and .75 rounds up to the next whole band (official rule).
   Averages of half bands are exact multiples of 0.125, so ×2 then Math.round is exact. */
function ieltsOverall(t){
  const v = TG_SKILLS.map(([k]) => t && t[k] !== '' && t[k] != null ? Number(t[k]) : NaN);
  if (v.some(x => !Number.isFinite(x))) return '';
  return (Math.round(v.reduce((a, b) => a + b, 0) / 4 * 2) / 2).toFixed(1);
}
const tgSelect = (k, l, val) => `<select name="${k}" aria-label="${l} target band" data-tg><option value="">—</option>${TG_BANDS.map(b => `<option ${val === b ? 'selected' : ''}>${b}</option>`).join('')}</select>`;
const tgOverallHTML = (t, short) => { const o = ieltsOverall(t); return `<b class="tg-ov-v">${o || '—'}</b><small class="tg-auto">${ic('calculator')} ${o ? (short ? 'Auto-calculated' : 'Calculated automatically') : (short ? 'Incomplete' : 'Incomplete: set all four skills')}</small>`; };
function ieltsTargetHTML(){
  const tg = settings().ieltsTargets || {};
  if (S.tgEdit) return `<form class="tgoal editing" id="tg-form">
    <div class="tg-h"><span>${ic('flag')} IELTS Target</span><em>Your goal</em></div>
    <div class="tg-grid">${TG_SKILLS.map(([k,l,icn]) => `<label class="tg-cell"><span>${ic(icn)} ${l}</span>${tgSelect(k, l, tg[k])}</label>`).join('')}
      <div class="tg-cell ov" aria-live="polite"><span>${ic('target')} Overall</span><span class="tg-ov" id="tg-ov">${tgOverallHTML(tg, true)}</span></div></div>
    <div class="tg-acts"><button type="button" class="btn sm ghost" data-act="tg-cancel">Cancel</button><button class="btn sm primary">${ic('check')} Save targets</button></div>
  </form>`;
  const cell = ([k,l,icn]) => `<div class="tg-cell"><span>${ic(icn)} ${l}</span>${tg[k] ? `<b>${esc(tg[k])}</b>` : `<i>Set target</i>`}</div>`;
  const any = TG_SKILLS.some(([k]) => tg[k]);
  return `<div class="tgoal">
    <div class="tg-h"><span>${ic('flag')} IELTS Target</span><button type="button" class="link mi" data-act="tg-edit">${ic('pencil')} ${any ? 'Edit' : 'Set'}</button></div>
    <div class="tg-grid">${TG_SKILLS.map(cell).join('')}
      <div class="tg-cell ov"><span>${ic('target')} Overall</span><span class="tg-ov">${tgOverallHTML(tg, true)}</span></div></div>
  </div>`;
}
const tgFromForm = form => { const t = Object.fromEntries(new FormData(form)); const o = {}; TG_SKILLS.forEach(([k]) => o[k] = TG_BANDS.includes(t[k]) ? t[k] : ''); o.overall = ieltsOverall(o); return o; };
/* live overall while choosing bands (dashboard editor and onboarding) */
document.addEventListener('change', e => {
  if (!e.target.matches('select[data-tg]')) return;
  const form = e.target.form, out = form && form.querySelector('#tg-ov, #ob-ov');
  if (out) { out.innerHTML = tgOverallHTML(tgFromForm(form), out.id === 'tg-ov'); drawIcons(); }
});


/* ---------- Profile avatar: stored in the settings record as '' (initial),
   'p:<id>' (built-in) or a small data:image/jpeg URL (upload, 160px). */
const AVATARS = [['cat','#E8578A'],['bird','#4B3BE6'],['rabbit','#1F9D74'],['fish','#2B8AC6'],['flower-2','#C2410C'],['leaf','#3F8F3A'],['sun','#D99A00'],['moon','#5B5BD6'],['star','#B4469B'],['rocket','#0E7C86'],['mountain-snow','#475569']];
function avatarInner(st){
  const a = (st && st.avatar) || '', nm = ((st && st.name) || '').trim();
  if (a.startsWith('data:image/') || /^https:\/\//.test(a)) return `<img src="${esc(a)}" alt="" referrerpolicy="no-referrer">`;
  const p = a.startsWith('p:') && AVATARS.find(([id]) => id === a.slice(2));
  if (p) return ic(p[0]);
  return esc(nm ? nm[0].toUpperCase() : 'T');
}
const avatarStyle = st => { const a = (st && st.avatar) || ''; const p = a.startsWith('p:') && AVATARS.find(([id]) => id === a.slice(2)); return p ? `background:${p[1]}` : ''; };
function avatarPickerHTML(cur, name){
  return `<div class="avpick" data-avpick>
    <input type="hidden" name="avatar" value="${esc(cur || '')}">
    <div class="avpick-prev avatar" style="${avatarStyle({avatar:cur})}" aria-hidden="true">${avatarInner({avatar:cur, name})}</div>
    <div class="avpick-opts">
      <div class="avpick-grid" role="radiogroup" aria-label="Choose an avatar">
        <button type="button" class="avpick-o ${!cur ? 'on' : ''}" data-av="" role="radio" aria-checked="${!cur}" title="Your initial"><span class="avatar">${esc(((name || '').trim()[0] || 'T').toUpperCase())}</span></button>
        ${AVATARS.map(([id, c]) => `<button type="button" class="avpick-o ${cur === 'p:' + id ? 'on' : ''}" data-av="p:${id}" role="radio" aria-checked="${cur === 'p:' + id}" title="${esc(id.replace(/-\d$/, ''))}"><span class="avatar" style="background:${c}">${ic(id)}</span></button>`).join('')}
      </div>
      <div class="avpick-acts">
        <label class="btn sm">${ic('upload')} Upload a photo<input type="file" accept="image/*" data-avupload hidden></label>
        <button type="button" class="link" data-av="" ${cur ? '' : 'hidden'} data-avremove>Remove</button>
      </div>
    </div>
  </div>`;
}
function avatarPickSet(box, val){
  box.querySelector('input[name=avatar]').value = val;
  box.querySelectorAll('.avpick-o').forEach(b => { const on = b.dataset.av === val; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
  const form = box.closest('form'), name = form && form.elements.name ? form.elements.name.value : '';
  const prev = box.querySelector('.avpick-prev'); prev.innerHTML = avatarInner({avatar:val, name}); prev.setAttribute('style', avatarStyle({avatar:val}));
  const rm = box.querySelector('[data-avremove]'); if (rm) rm.hidden = !val;
  drawIcons();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-avpick] [data-av]'); if (!b) return;
  avatarPickSet(b.closest('[data-avpick]'), b.dataset.av);
});
document.addEventListener('change', e => {
  if (!e.target.matches('[data-avupload]')) return;
  const file = e.target.files && e.target.files[0], box = e.target.closest('[data-avpick]'); e.target.value = '';
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Choose an image file (JPG, PNG, WebP or HEIC).', true); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const S2 = 160, c = document.createElement('canvas'); c.width = c.height = S2;
    const k = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - k) / 2, sy = (img.naturalHeight - k) / 2;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S2, S2); g.drawImage(img, sx, sy, k, k, 0, 0, S2, S2);
    URL.revokeObjectURL(url);
    avatarPickSet(box, c.toDataURL('image/jpeg', 0.82));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That image couldn’t be opened. Try a JPG or PNG.', true); };
  img.src = url;
});
document.addEventListener('input', e => {
  if (e.target.name !== 'name' || !e.target.form) return;
  const box = e.target.form.querySelector('[data-avpick]'); if (!box) return;
  const v = box.querySelector('input[name=avatar]').value, ch = ((e.target.value || '').trim()[0] || 'T').toUpperCase();
  const first = box.querySelector('.avpick-o[data-av=""] .avatar'); if (first) first.textContent = ch;
  if (!v) box.querySelector('.avpick-prev').textContent = ch;
});

/* ---------- First-run onboarding (website accounts only, shown once) */
const OB_LANGS = [['english','English','languages'],['ielts','IELTS preparation','graduation-cap'],['korean','Korean','languages'],['other','Another language','globe']];
function onboardShow(){

  const ob = {step:1, name:st0.name || '', avatar:st0.avatar || '', goals:[], other:'', daily:Number(st0.dailyNew) || 10, tg:{}};
  const mark = how => { const st = settings(); if (!st.onboarding) Store.put({...clone(st), onboarding:how, onboardedAt:Date.now()}); };
  const saveProfile = () => {          // never replace an existing value with an empty one
    const st = clone(settings()), up = {};
    if (ob.name.trim() && ob.name.trim() !== st.name) up.name = ob.name.trim();
    if (ob.avatar !== (st.avatar || '') && (ob.avatar || !st.avatar)) up.avatar = ob.avatar;

      <div class="fld ob-l"><span>Avatar</span>${avatarPickerHTML(ob.avatar, ob.name)}</div>
      <div class="ob-nav"><button type="button" class="btn ghost" data-ob="back">${ic('arrow-left')} Back</button><button type="button" class="btn primary" data-ob="next">Continue ${ic('arrow-right')}</button></div>${skip}`;
    const ie = ob.goals.includes('ielts');

      ${ie ? `<div class="ob-ielts"><b>${ic('flag')} What’s your IELTS goal?</b><small class="muted">Set your target band scores to personalize your learning journey.</small>
        <div class="ob-grid">${TG_SKILLS.map(([k,l,icn]) => `<label class="ob-cell"><span>${ic(icn)} ${l}</span>${tgSelect(k, l, ob.tg[k] || '')}</label>`).join('')}</div>
        <div class="ob-ov" aria-live="polite"><span>${ic('target')} Overall band</span><span class="tg-ov" id="ob-ov">${tgOverallHTML(ob.tg)}</span></div></div>` : ''}
      <label class="fld ob-l"><span>New words per day</span><select name="daily">${[5,10,15,20,30].map(n => `<option ${ob.daily === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <div class="ob-nav"><button type="button" class="btn ghost" data-ob="back">${ic('arrow-left')} Back</button><button class="btn primary" id="ob-save">${ic('check')} ${ie ? 'Save My Target' : 'Start learning'}</button></div>${skip}`;
  };
  const collect = f => {
    if (f.elements.name) ob.name = f.elements.name.value;
    if (f.elements.avatar) ob.avatar = f.elements.avatar.value;
    if (f.querySelector('[name=goal]')) ob.goals = [...f.querySelectorAll('[name=goal]:checked')].map(x => x.value);

      modalClose = null; closeModal(true);
      toast(up.ieltsTargets ? 'Profile and IELTS target saved' : 'You’re all set');
    });
  }});
}

/* ---------- Appearance: light / dark / system.
   Saved in the account's settings record (theme, themeAt) so it follows the person;
   a small local copy ({mode, at, owner}) applies it instantly on the next load. */
const THEME_KEY = 'thuverse.theme';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const THEME_LBL = {light:'Light', dark:'Dark', system:'System'};
function themeLocal(){
  try { const j = JSON.parse(localStorage.getItem(THEME_KEY) || 'null'); if (j && THEME_LBL[j.mode]) return j; } catch {}
  const legacy = lsGet('englishHub.theme');                       // older versions kept only light/dark here
  return THEME_LBL[legacy] ? {mode:legacy, at:1, owner:null} : {mode:'system', at:0, owner:null};
}
const themeSave = o => lsSet(THEME_KEY, JSON.stringify(o));
const themeMode = () => document.documentElement.dataset.themeMode || 'system';
/* the signed-in account whose settings are loaded, or null */
const themeAcct = () => Store.mode === 'cloud' ? (Web.uid || (isClaude() ? 'claude' : null)) : null;
function applyTheme(mode){
  const t = mode === 'dark' || mode === 'light' ? mode : (sysDark.matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t; document.documentElement.dataset.themeMode = mode;
}
function setTheme(mode){
  if (!THEME_LBL[mode]) return;
  const at = Date.now(), owner = Web.uid || (isClaude() ? 'claude' : null);
  themeSave({mode, at, owner}); applyTheme(mode);
  const st = settings(); if (st.theme !== mode) Store.put({...clone(st), theme:mode, themeAt:at});
  render();
}
/* Reconcile the account's saved choice with this device's: the newer explicit choice wins.
   A choice made before signing in is carried into the account; another account's choice never is. */
function themeReconcile(){
  const owner = themeAcct(); if (!owner) return;
  const st = settings(), loc = themeLocal(), accAt = st.themeAt || 0;
  if (st.theme && THEME_LBL[st.theme] && accAt >= loc.at) {
    if (loc.mode !== st.theme || loc.owner !== owner || loc.at !== accAt) themeSave({mode:st.theme, at:accAt, owner});
    if (themeMode() !== st.theme) applyTheme(st.theme);
  } else if (loc.at > accAt && (!loc.owner || loc.owner === owner)) {
    Store.put({...clone(st), theme:loc.mode, themeAt:loc.at}); themeSave({...loc, owner});
  } else if (!st.theme && loc.owner && loc.owner !== owner) {
    themeSave({mode:'system', at:0, owner}); applyTheme('system');
  }
}
sysDark.addEventListener('change', () => { if (themeMode() === 'system') { applyTheme('system'); render(); } });

function openLesson(lid){
  const s = Store.get('lp-' + lid);
  if (!s) Store.put({id:'lp-' + lid, kind:'lesson', lid, status:'started', createdAt:Date.now(), lastOpened:Date.now()});
  else touch('lp-' + lid, () => s);
  touchCol(LESSONS[lid].col);
}
function answerLesson(qi, oi){
  const l = LESSONS[S.lq.lid]; if (!l || S.lq.answers[qi] !== undefined) return;
  S.lq.answers[qi] = oi;
  if (Object.keys(S.lq.answers).length === l.quiz.length) {
    const score = l.quiz.filter((q,i) => S.lq.answers[i] === q[2]).length;
    const s = clone(Store.get('lp-' + l.id) || {id:'lp-' + l.id, kind:'lesson', lid:l.id, createdAt:Date.now()});
    const was = s.status;
    s.best = Math.max(s.best || 0, score); s.last = score; s.lastOpened = Date.now();
    if (score >= Math.ceil(l.quiz.length * .75)) { s.status = 'done'; if (s.mark !== 'mastered') s.mark = 'reviewed'; } else if (s.status !== 'done') s.status = 'started';
    if (s.status === 'done' && was !== 'done') { s.completedAt = Date.now(); toast('Lesson complete'); }
    Store.put(s); bump('n');
  } else render();
}

const BD_HELP_TITLE = {add:['Adding a new word','Thêm từ mới'], grammar:['Grammar Library','Thư viện ngữ pháp'], collection:['Organising your collections','Sắp xếp bộ sưu tập'], review:['How flashcards work','Cách dùng flashcard'],

  ielts:['IELTS Workspace','IELTS Workspace'], journal:['Learning Journal','Learning Journal'], search:['Searching','Tìm kiếm'], settings:['Profile and appearance','Hồ sơ và giao diện'], linking:['Linking phrases','Linking phrases']};
function bdHelpMatch(text){
  const t = ' ' + text.toLowerCase().replace(/[?!.,]/g, ' ').replace(/\s+/g, ' ') + ' ';
  let best = null, bs = 0;
  for (const h of BD_HELP) { let s = 0; for (const k of h.k) if (t.includes(k)) s += k.length; if (s > bs) { bs = s; best = h; } }
  return bs >= 4 ? best : null;
}

/* ---------- understanding a message (no AI) */
const BD_PARTICLES = ['up','down','out','off','on','in','over','away','back','through','around','about','along','across','by','into','after','forward','apart','together'];
const bdClean = s => String(s || '').trim().replace(/^["“'‘]+|["”'’]+$/g, '').replace(/[?.!]+$/, '').trim();
const bdTermOk = s => !!s && s.length <= 60 && s.split(/\s+/).length <= 6 && /^[\p{L}][\p{L}\p{M}' \-]*$/u.test(s);
const BD_NOT_TERM = /\b(my|app|page|library|collection|collections|review|dashboard|setting|settings|thuverse|flashcards?|progress|grammar library|journal|lumi)\b/i;
function bdIntent(raw){
  const s = bdClean(raw).replace(/\s+/g, ' '), low = s.toLowerCase();
  let m;
  if (/\b(this page|what can i do here|trang này)\b/i.test(low)) return {t:'page'};
  if ((m = s.match(/^(?:please\s+|can you\s+|could you\s+)?(?:add|save|put)\s+(?:the\s+)?(?:word|phrase|phrasal verb|collocation\s+)?\s*["“]?(.+?)["”]?\s+(?:to|in|into)\s+(?:my\s+|the\s+)?(.+?)$/i)) && bdTermOk(bdClean(m[1])) && !/^(a|an)\s+new\b/i.test(m[1])) return {t:'save', term:bdClean(m[1]), target:m[2]};
  if ((m = s.match(/^(?:hãy\s+|giúp mình\s+|giúp tôi\s+)?(?:thêm|lưu|bỏ)\s+(?:từ\s+|cụm từ\s+)?["“]?(.+?)["”]?\s+vào\s+(?:bộ sưu tập\s+|mục\s+|chủ đề\s+|danh sách\s+)?(.+)$/i)) && bdTermOk(bdClean(m[1]))) return {t:'save', term:bdClean(m[1]), target:m[2]};
  if ((m = s.match(/^(?:please\s+)?(?:add|save)\s+(?:the\s+word\s+|the\s+phrase\s+)?["“]?([^"”]+?)["”]?$/i)) && bdTermOk(bdClean(m[1])) && !/^(a|an|new)\b/i.test(m[1]) && !BD_NOT_TERM.test(m[1])) return {t:'save', term:bdClean(m[1]), target:''};
  if ((m = s.match(/^(?:thêm|lưu)\s+(?:từ\s+|cụm từ\s+)["“]?(.+?)["”]?$/i)) && bdTermOk(bdClean(m[1]))) return {t:'save', term:bdClean(m[1]), target:''};
  if ((m = s.match(/\bcollocations?\s+(?:for|with|of|using)\s+["“]?(.+?)["”]?$/i)) || (m = s.match(/\b(?:collocation|cụm từ đi với|từ đi với)\s+(?:cho|với|của)?\s*["“]?(.+?)["”]?$/i))) { const w = bdClean(m[1]); if (bdTermOk(w)) return {t:'col', term:w}; }
  if (/\b(difference|khác nhau|khác gì|how|where|why|when|làm sao|ở đâu|thế nào|cách)\b/i.test(low)) return null;
  const tries = [/^(?:please\s+|can you\s+)?(?:look\s*up|define|check|search for|find)\s+(?:the\s+)?(?:word|phrase|phrasal verb|meaning of)?\s*["“]?(.+?)["”]?$/i,
    /^what(?:'s| is| does)\s+(?:the\s+)?(?:meaning of\s+|word\s+)?["“]?(.+?)["”]?(?:\s+mean)?$/i, /^meaning of\s+["“]?(.+?)["”]?$/i, /^["“]?(.+?)["”]?\s+meaning$/i,
    /^(?:tra(?:\s+cứu)?(?:\s+từ)?|nghĩa của(?:\s+từ)?|định nghĩa)\s+["“]?(.+?)["”]?$/i, /^["“]?(.+?)["”]?\s+(?:nghĩa là gì|có nghĩa là gì|là gì|nghĩa là sao)$/i];
  for (const rx of tries) if ((m = s.match(rx))) { const w = bdClean(m[1]); if (bdTermOk(w) && !BD_NOT_TERM.test(w)) return {t:'lookup', term:w}; }
  if (bdTermOk(s) && s.split(' ').length <= 3 && !BD_NOT_TERM.test(s) && !bdHelpMatch(s) && !/^(hi|hello|hey|thanks|thank you|xin chào|chào|cảm ơn|ok|okay|yes|no)$/i.test(s)) return {t:'lookup', term:s};
  return null;
}

/* ---------- user data Lumi may use (the signed-in user's own records, already scoped by Store) */
const bdTopics = () => { const c = {}; items().forEach(r => [r.category, ...(r.tags || [])].filter(Boolean).forEach(t => { const k = t.trim(); c[k] = (c[k] || 0) + 1; })); return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([t]) => t); };
const BD_SAVE_COLS = ['vocabulary','collocations','idioms','linking'];
const BD_COLWORDS = {vocabulary:['vocabulary','vocab','words','word list','từ vựng'], collocations:['collocations','collocation','phrasal verbs','phrasal verb','phrasal','collocations & phrasal verbs','cụm từ'], idioms:['idioms','idiom','expressions','idioms & expressions','thành ngữ'], linking:['linking phrases','linking','từ nối']};
const bdGuessCol = term => { const w = term.trim().toLowerCase().split(/\s+/); if (w.length === 1) return 'vocabulary'; return 'collocations'; };
const bdIsPhrasal = term => { const w = term.trim().toLowerCase().split(/\s+/); return w.length >= 2 && w.length <= 3 && BD_PARTICLES.includes(w[w.length - 1]); };
function bdResolveTarget(raw){
  const name = String(raw || '').replace(/(^|\s)(my|the|collection|collections|list|topic|section|bộ sưu tập|chủ đề|mục|danh sách|của mình|của tôi)(?=\s|$)/gi, ' ').replace(/\s+/g, ' ').trim();
  const t = name.toLowerCase();
  if (!t) return {};
  for (const [col, words] of Object.entries(BD_COLWORDS)) if (words.includes(t)) return {col};
  const topics = bdTopics(), exact = topics.find(x => x.toLowerCase() === t);
  if (exact) return {topic:exact};
  const near = topics.filter(x => { const a = x.toLowerCase(); return a.includes(t) || t.includes(a) || (a.length > 4 && t.length > 4 && a.slice(0, 5) === t.slice(0, 5)); });
  if (near.length === 1) return {topic:near[0]};
  if (near.length > 1) return {ask:near.slice(0, 5), name};
  return {topic:name.slice(0, 40).replace(/^./, c => c.toUpperCase()), isNew:true};
}
const bdFindSaved = term => { const k = termKey(term); return k ? items().find(r => termKey(r.term) === k) : null; };

async function bdLookup(term, mode){
  const m = bdPush({role:'bot', kind:'lookup', term, mode, lk:{word:term}});
  try {
    const mcp = await lkInit();
    if (!mcp) { m.lk = {err:bdT('noLookup')}; return bdUpdate(m); }
    const o = await lkLookup(term, part => { m.lk = part; bdUpdate(m); });
    m.lk = o; bdUpdate(m);
    return m;
  } catch (e) { m.lk = {err:(e && e.code === 'sign_in_required' && e.message) || bdT('lookupErr')}; bdUpdate(m); }
}

async function bdHandle(text){

  if (wait && bdTermOk(bdClean(text)) && !bdHelpMatch(text)) return wait === 'col' ? bdLookup(bdClean(text), 'col') : bdLookup(bdClean(text));
  const it = bdIntent(text);
  if (it && it.t === 'lookup') return bdLookup(it.term);
  if (it && it.t === 'col') return bdLookup(it.term, 'col');

function sentenceAround(text, sel){
  const i = text.toLowerCase().indexOf(sel.toLowerCase()); if (i < 0) return '';
  let s = i, e = i + sel.length;
  while (s > 0 && !/[.!?\n]/.test(text[s-1])) s--;
  while (e < text.length && !/[.!?\n]/.test(text[e])) e++;
  return text.slice(s, Math.min(text.length, e + 1)).trim();
}

function sparkline(sc, target){
  const W = 300, H = 70, p = 6, lo = 4, hi = 9;
  const y = b => H - p - (Math.max(lo, Math.min(hi, b)) - lo) / (hi - lo) * (H - 2*p);
  const ty = y(target);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--pen)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  const pts = sc.slice(-12);
  if (pts.length) {
    const x = i => pts.length === 1 ? W/2 : p + i * (W - 2*p) / (pts.length - 1);
    s += `<polyline fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((r,i)=>x(i)+','+y(r.band)).join(' ')}"/>`;
    s += pts.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.band)}" r="3.5" fill="${i===pts.length-1?'var(--surface)':'var(--primary)'}" stroke="var(--primary)" stroke-width="1.5"/>`).join('');
  }
  return s + '</svg>';
}

/* ---------- Study session (learn, quiz, review) */
const norm = s => String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const canType = v => v.term && !/[…]|\.\.\./.test(v.term) && v.term.length <= 32 && (v.vi || v.def) && !v.mistake;
function blankEx(ex, term){
  if (!ex) return '';
  const rx = new RegExp("[A-Za-z]*" + reRx(term) + "[A-Za-z]*", 'ig');
  return rx.test(ex) ? esc(ex.replace(rx, '\u0000')).replace(/\u0000/g, '<span class="blank">_____</span>') : '';
}
function stepValid(s, st){
  if (!st) return false;
  if (st.t === 'learn') return !!WORDS[st.wid] && (!cardOf(st.wid) || st.done);
  const r = Store.get(st.key);
  if (!r || !r.srs) return false;
  if (r.kind === 'card' && (r.status === 'known' || !WORDS[r.wid])) return false;
  return true;
}
function curStep(s){ let i = s.idx; while (i < s.steps.length && !stepValid(s, s.steps[i])) i++; return i; }
function startSession(label, steps, meta={}){
  if (!steps.length) { toast('Nothing to study here right now.'); return; }
  const s = {id:'session', kind:'session', label, steps, idx:0, tally:{learned:0, known:0, right:0, wrong:0, reviewed:0}, fails:{}, re:{}, startedAt:Date.now(), meta};

}
function learnSteps(colId, n){

  const fresh = c.wordIds.filter(w => !cardOf(w)).slice(0, n);
  const typeable = fresh.filter(w => canType(WORDS[w]));
  return [...fresh.map(w => ({t:'learn', wid:w})), ...shuffle(fresh).map(w => ({t:'mc', key:'c-' + w})), ...shuffle(typeable).map(w => ({t:'type', key:'c-' + w}))];
}

function mcOptions(r){

function sessionAct(kind, el){
  const s0 = Store.get('session'); if (!s0) return;
  const s = clone(s0), cur = curStep(s), step = s.steps[cur]; if (!step) return;
  const ui = S.ui || (S.ui = {});
  if (kind === 'learn' || kind === 'known') {
    if (step.t !== 'learn') return;
    if (!cardOf(step.wid)) Store.put(newCard(step.wid, kind === 'known'));
    s.steps[cur].done = true;
    if (kind === 'learn') { s.tally.learned++; bump('n'); } else s.tally.known++;
    return advance(s, cur);
  }
  if (kind === 'mc') {
    if (step.t !== 'mc' || ui.picked !== null && ui.picked !== undefined) return;
    ui.picked = Number(el.dataset.o);
    if (ui.picked === ui.right) s.tally.right++; else { s.tally.wrong++; s.fails[step.key] = 1; requeue(s, step); }
    scheduleAfterQuiz(s, step.key, cur);
    sessionSave(s); return render();
  }
  if (kind === 'type' || kind === 'giveup') {
    if (ui.typed) return;
    const r = Store.get(step.key), v = wv(r);
    const val = kind === 'giveup' ? '' : ($('#typein') || {}).value || '';
    const a = norm(val), b = norm(v.term);
    const ok = !!a && (a === b || (b.length > 4 && lev(a, b) <= 1));
    ui.typed = {val, ok, almost: ok && a !== b};
    if (step.t === 'rev') ui.grade = ok ? 2 : 0;
    else { if (ok) s.tally.right++; else { s.tally.wrong++; s.fails[step.key] = 1; requeue(s, step); } scheduleAfterQuiz(s, step.key, cur); }
    sessionSave(s); return render();
  }
  if (kind === 'override') { if (ui.typed) { ui.typed.ok = true; ui.grade = 2; } return render(); }
  if (kind === 'flip') { if (!ui.flipped) { ui.flipped = true; render(); } return; }
  if (kind === 'rate') {
    const g = Number(el.dataset.g), r = Store.get(step.key);
    applyRating(r, g); s.tally.reviewed++;
    if (g === 0) requeue(s, step);
    return advance(s, cur);
  }
  if (kind === 'next') {
    if (step.t === 'rev' && ui.grade !== undefined) { applyRating(Store.get(step.key), ui.grade); s.tally.reviewed++; if (ui.grade === 0) requeue(s, step); }
    if ((step.t === 'mc' && (ui.picked === null || ui.picked === undefined)) || ((step.t === 'type' || (step.t === 'rev' && ui.mode === 'type')) && !ui.typed)) return;
    return advance(s, cur);
  }
}

/* =========================================================
   Global search: results popover as you type, plus a full results page.
   Runs in the page over the person's own synced records (already limited to

   never sends a database query.

const SR = {q:'', key:'', timer:0, res:null, active:-1, open:false};
const SR_GROUPS = [['vocab','Vocabulary','book-a'],['colloc','Collocations','link-2'],['phrasal','Phrasal verbs','corner-down-right'],['linking','Linking phrases','link'],['idioms','Idioms & expressions','message-square-quote'],['grammar','Grammar','languages'],['structures','Sentence structures','quote'],['mistakes','Common mistakes','triangle-alert'],['reading','Reading list','newspaper'],['ielts','IELTS Workspace','graduation-cap'],['journal','Learning Journal','notebook-pen']];
/* accent-insensitive folding that keeps string length, so highlights line up (giảm ↔ giam) */
const srFold = t => { let o = ''; const x = String(t || ''); for (let i = 0; i < x.length; i++) { const c = x[i], f = c.normalize('NFD').replace(/[̀-ͯ]/g, ''); o += (f[0] || c) === 'đ' || c === 'đ' || c === 'Đ' ? 'd' : (f[0] || c).toLowerCase(); } return o; };
const srToks = q => srFold(q).split(/\s+/).filter(Boolean);
function srHL(text, toks, max){
  let t = String(text || '').replace(/\s+/g, ' ').trim();
  if (max && t.length > max) {                         // centre the snippet on the first match
    const f = srFold(t), i = Math.max(0, Math.min(...toks.map(k => { const j = f.indexOf(k); return j < 0 ? 1e9 : j; })));
    const st = i > max * .4 && i < 1e9 ? Math.max(0, i - Math.round(max * .3)) : 0;
    t = (st ? '…' : '') + t.slice(st, st + max).trim() + (st + max < t.length ? '…' : '');
  }
  const f = srFold(t), marks = new Array(t.length).fill(false);
  toks.forEach(k => { let j = f.indexOf(k); while (k && j >= 0) { for (let n = j; n < j + k.length; n++) marks[n] = true; j = f.indexOf(k, j + k.length); } });
  let out = '', on = false;
  for (let i = 0; i < t.length; i++) { if (marks[i] !== on) { out += on ? '</mark>' : '<mark>'; on = marks[i]; } out += esc(t[i]); }
  return out + (on ? '</mark>' : '');
}

/* ---------- Dictionary lookup

  dm: q => `https://api.datamuse.com/words?${q}&max=12`,

  wiki:{name:'Wiktionary', note:'CC BY-SA', home:'https://en.wiktionary.org'},
  dm:{name:'Datamuse', note:'Google Books Ngrams & WordNet', home:'https://www.datamuse.com/api/'},

const LK_WEB = {web:true};

async function lkWebFetch(url, signal){

function lkBalanced(t, i){

    const c = t[j];
    if (inS) { if (escp) escp = false; else if (c === '\\') escp = true; else if (c === '"') inS = false; continue; }
    if (c === '"') inS = true; else if (c === '[' || c === '{') depth++;

      for (let i = 0; i < v.length && tries < 300; i++) {

        try { const p = JSON.parse(s); const r = visit(p, d + 1); if (r) return r; i += s.length - 1; } catch {}

    }

const lkRaw = res => { try { const t = JSON.stringify(res && (res.structuredContent || res.payload || res.content)); return (t || '').slice(0, 500); } catch { return ''; } };

async function lkFree(word){

  if (!data) return lkJSON(res, v => v && v.title && /no definitions/i.test(v.title)) ? {status:'notfound'} : {status:'unreadable', raw:lkRaw(res)};
  const r = {status:'ok', ipaUK:'', ipaUS:'', ipa:'', senses:[], syn:[], ant:[], links:[]};
  data.forEach(e => {

const wClean = s => String(s || '')
  .replace(/\{\{(?:l|m|w|link|mention|ll)\|[a-z-]+\|([^|}]+)[^}]*\}\}/g, '$1')

const DM_STOP = new Set('the a an of to in on for and or but with by at from as is are was were be been it its this that these those his her their my your our more most very so than then also not no into up out over about'.split(' '));
async function lkDatamuse(word){

    ...(m.jjb || []).map(x => ({p:`${x.word} ${word}`, s:x.score})),

async function lkMW(word, key){
  const res = await lkFetch(LK_URL.mw(word, key));
  const arr = lkJSON(res, v => Array.isArray(v) && (v.length === 0 || typeof v[0] === 'string' || (v[0] && v[0].meta)));
  if (!arr) { const t = lkRaw(res); return /key/i.test(t) ? {status:'error', message:'Merriam-Webster rejected the key.'} : {status:'unreadable', raw:t}; }
  if (!arr.length || typeof arr[0] === 'string') return {status:'notfound', suggest:arr.slice(0, 6)};
  const r = {status:'ok', ipaUK:'', ipaUS:'', senses:[], url:`https://www.learnersdictionary.com/definition/${enc(word)}`};
  arr.filter(e => e && e.meta && String(e.meta.id).split(':')[0].toLowerCase() === word.toLowerCase()).slice(0, 4).forEach(e => {
    ((e.hwi && e.hwi.prs) || []).forEach(p => { if (!p.ipa) return; if (/british/i.test(p.l || '')) r.ipaUK = r.ipaUK || slash(p.ipa); else r.ipaUS = r.ipaUS || slash(p.ipa); });
    const pos = e.fl || '';
    (e.def || []).forEach(d => (d.sseq || []).forEach(seq => seq.forEach(([kind, sense]) => {
      if (kind !== 'sense' || !sense || !sense.dt) return;
      let def = ''; const ex = [];
      sense.dt.forEach(([t, v]) => { if (t === 'text') def += mwClean(v) + ' '; if (t === 'vis' && Array.isArray(v)) v.forEach(x => x && x.t && ex.push(mwClean(x.t))); });
      def = def.trim(); if (def) r.senses.push({pos, def, ex});
    })));
    if (!r.senses.length) (e.shortdef || []).forEach(d => r.senses.push({pos, def:d, ex:[]}));
  });
  if (!r.senses.length) return {status:'notfound'};
  return r;
}

async function lkSource(fn){
  try { return await fn(); }
  catch (e) { if (e && PAGE_LEVEL.includes(e.code)) throw e; return {status:'error', message:(e && e.message) || 'The request failed.', code:e && e.code}; }
}
/* onPart(o) is called each time another source answers, so results can show as they arrive */
async function lkLookup(word, onPart){
  const key = LK.mcp === LK_WEB ? (Web.cfg && Web.cfg.mw ? 'server' : '') : (settings().mwKey || '').trim();
  const o = {word, src:{free:{status:'pending'}, wiki:{status:'pending'}, dm:{status:'pending'}, mw:key ? {status:'pending'} : {status:'off'}}, at:Date.now()};
  const upd = () => { o.m = lkMerge(o); if (onPart) onPart(o); };
  o.src.free = await lkSource(() => lkFree(word)); upd();      // first call alone: it may ask for permission
  await Promise.all([
    lkSource(() => lkWiki(word)).then(r => { o.src.wiki = r; upd(); }),
    lkSource(() => lkDatamuse(word)).then(r => { o.src.dm = r; upd(); }),
    key ? lkSource(() => lkMW(word, key)).then(r => { o.src.mw = r; upd(); }) : null,
  ]);
  o.done = true; o.m = lkMerge(o);
  return o;
}
const okS = s => s && s.status === 'ok';
function lkMerge(o){
  const {free, wiki, dm, mw} = o.src, m = {};
  const pick = (field, cands) => { for (const [v, src] of cands) if (v && (!Array.isArray(v) || v.length)) { m[field] = {value:v, src}; return; } };
  pick('ipaUK', [[okS(free) && free.ipaUK, 'free'], [okS(wiki) && wiki.ipaUK, 'wiki'], [okS(mw) && mw.ipaUK, 'mw']]);
  pick('ipaUS', [[okS(free) && free.ipaUS, 'free'], [okS(wiki) && wiki.ipaUS, 'wiki'], [okS(mw) && mw.ipaUS, 'mw']]);
  if (!m.ipaUK && !m.ipaUS) pick('ipaAny', [[okS(free) && free.ipa, 'free'], [okS(wiki) && wiki.ipa, 'wiki']]);
  m.senses = [
    ...(okS(mw) ? mw.senses.slice(0, 6).map(s => ({...s, src:'mw'})) : []),
    ...(okS(free) ? free.senses.slice(0, 8).map(s => ({...s, src:'free'})) : []),
  ];
  m.choice = m.senses.length ? 0 : -1;
  if (okS(wiki) && wiki.vi.length) m.vi = {value:uniq(wiki.vi.flatMap(x => x.words), 4).join('; '), src:'wiki', all:wiki.vi};
  const union = (field, lists, n) => { const v = uniq(lists.flatMap(([l]) => l || []), n); if (v.length) m[field] = {value:v, src:lists.filter(([l]) => l && l.length).map(([, s]) => s)}; };
  union('syn', [[okS(free) && free.syn, 'free'], [okS(wiki) && wiki.syn, 'wiki'], [okS(dm) && dm.syn, 'dm']], 10);
  union('ant', [[okS(free) && free.ant, 'free'], [okS(wiki) && wiki.ant, 'wiki'], [okS(dm) && dm.ant, 'dm']], 8);
  if (okS(dm) && dm.col.length) m.col = {value:dm.col, src:'dm'};
  if (okS(wiki) && wiki.rel.length) m.rel = {value:wiki.rel, src:'wiki'};
  lkApplySense(m, m.choice);
  m.sources = Object.entries(o.src).filter(([, s]) => okS(s)).map(([k, s]) => ({name:SRC[k].name, url:k === 'free' ? (s.links[0] || SRC.free.home) : (s.url || SRC[k].home)}));
  return m;
}
function lkApplySense(m, i){
  m.choice = i;
  const s = m.senses[i];
  if (!s) { delete m.def; delete m.pos; delete m.ex; return; }
  m.def = {value:s.def, src:s.src}; m.pos = {value:s.pos, src:s.src};
  const ex = uniq([...s.ex, ...m.senses.filter((x, k) => k !== i && x.pos === s.pos && x.src === s.src).flatMap(x => x.ex)], 3);
  if (ex.length) m.ex = {value:ex, src:s.src}; else delete m.ex;
}

function setStatusSrs(rec, s, isNew){
  if (s === 'mastered') { rec.masteredAt = Date.now(); logEvent('mastered', rec.id); }
  rec.srs = rec.srs || {ease:2.5, interval:0, reps:0, lapses:0, due:Date.now()};
  if (s === 'mastered') { rec.srs.interval = Math.max(rec.srs.interval||0, 30); rec.srs.due = addDays(sod(), rec.srs.interval); rec.difficult = false; }
  else if (s === 'new' && !isNew) { rec.srs = {ease:2.5, interval:0, reps:0, lapses:0, due:Date.now()}; }
  else if (s === 'learning' && (rec.srs.interval||0) >= 21) { rec.srs.interval = 3; rec.srs.due = addDays(sod(), 1); }
}

function journalToVocab(id){
  const j = Store.get(id); if (!j) return;
  let added = 0, skipped = 0;
  const existing = new Set(items().filter(r => VOCAB_COLS.includes(r.col)).map(r => termKey(r.term)));
  lines(j.newVocab).forEach(l => {
    const m = l.split(/\s+[—–-]\s+|\s*:\s+|\t/);
    const term = (m[0]||'').trim(), vi = m.slice(1).join(' — ').trim();
    if (!term) return;
    if (existing.has(termKey(term))) { skipped++; return; }
    existing.add(termKey(term));
    const now = Date.now() + added;
    const nid = newId(); logEvent('added', nid);
    Store.put({id:nid, kind:'item', col:'vocabulary', term, vi, def:'', examples:'', ipa:'', context:'Journal, ' + fmtD(j.date), category:'', tags:[], ielts:[], notes:'', status:'new', createdAt:now, reviews:0, srs:{ease:2.5, interval:0, reps:0, lapses:0, due:now}});
    added++;
  });
  toast(added ? `Saved ${plural(added,'word')} to Vocabulary${skipped?`; ${skipped} already there`:''}` : 'All of these words are already in your Vocabulary');
}

function speak(t){
  try {
    if (!('speechSynthesis' in window)) throw 0;
    const lang = settings().accent || 'en-GB';
    const u = new SpeechSynthesisUtterance(String(t).replace(/…/g,', '));
    u.lang = lang; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase() === lang.toLowerCase());
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch { toast('Your browser can’t read text aloud here.', true); }
}

function exportData(){
  const json = JSON.stringify({app:'english-hub', version:1, exportedAt:new Date().toISOString(), records:all()}, null, 1);
  const area = $('#io-area');
  const done = () => toast('Backup copied. Paste it into a note or file to keep it safe.');
  try { navigator.clipboard.writeText(json).then(done, () => showJson()); } catch { showJson(); }
  function showJson(){ if (area) { area.innerHTML = `<p class="muted" style="font-size:14px;margin:0 0 6px">Copying isn’t allowed here. Select all of the text below and copy it.</p><textarea class="code" readonly>${esc(json)}</textarea>`; area.querySelector('textarea').select(); } }
}
function importOpen(){
  $('#io-area').innerHTML = `<div class="stack"><textarea class="code" id="imp-text" placeholder="Paste a backup here, or choose a file below"></textarea>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="file" id="imp-file" accept=".json,application/json"><button class="btn primary" data-act="import-run">Import</button></div></div>`;
  $('#imp-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) f.text().then(t => $('#imp-text').value = t); });
}
function importRun(){
  try {
    const data = JSON.parse($('#imp-text').value);
    const recs = Array.isArray(data) ? data : data.records;
    if (!Array.isArray(recs)) throw new Error();
    let n = 0;
    recs.forEach(r => { if (r && r.id && r.kind && /^[A-Za-z0-9_\-.~:@+]+$/.test(r.id)) { Store.put(clone(r)); n++; } });
    $('#io-area').innerHTML = ''; toast(`Imported ${plural(n,'record')}`);
  } catch { toast('That isn’t a valid backup. Paste the full text you copied from “Copy backup”.', true); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');

  if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || el.dataset.act !== 'close-nav') e.preventDefault();
  if (el.dataset.act === 'close-nav') { closeModal(); return; }
  fn(el, e);
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input','textarea','select'].includes(tag) || e.target.isContentEditable;
  const modal = !!$('#modal-root').firstElementChild;
  if (e.key === 'Escape') {
    if (modal) { closeModal(); return; }
    if (S.search) { S.search = ''; $('#gsearch').value = ''; $('#gsearch').blur(); render(); return; }
    if (S.view === 'study' && Store.get('session')) { ACT['s-exit'](); return; }
  }
  const studying = S.view === 'study' && !S.search && !modal && Store.get('session');
  if (studying && !(typing && e.target.id !== 'typein')) {
    const sess = Store.get('session'), step = sess.steps[curStep(sess)], ui = S.ui || {};
    if (step) {
      const k = e.key;
      if (step.t === 'learn' && k === 'Enter') { e.preventDefault(); return sessionAct('learn'); }
      if (step.t === 'mc') {
        if ((ui.picked === null || ui.picked === undefined) && ['1','2','3','4'].includes(k)) { e.preventDefault(); return sessionAct('mc', {dataset:{o:Number(k)-1}}); }
        if (ui.picked !== null && ui.picked !== undefined && (k === 'Enter' || k === ' ')) { e.preventDefault(); return sessionAct('next'); }
      }
      if (ui.typed && (k === 'Enter') && e.target.id !== 'typein') { e.preventDefault(); return sessionAct('next'); }
      if (step.t === 'rev' && ui.mode === 'flip') {
        if (!ui.flipped && (k === ' ' || k === 'Enter')) { e.preventDefault(); return sessionAct('flip'); }
        if (ui.flipped && ['1','2','3','4'].includes(k)) { e.preventDefault(); return sessionAct('rate', {dataset:{g:Number(k)-1}}); }
      }
    }
    if (e.target.id === 'typein') return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (typing || modal || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#gsearch').focus(); }
  else if (e.key === 'n') { e.preventDefault(); itemForm(null, {col: S.view === 'knowledge' && COLS[S.kCol] ? S.kCol : 'vocabulary'}); }
  else if (e.key === 'r' && dueItems().length && S.view !== 'study') { e.preventDefault(); startReviewDeck('due'); }
});
document.addEventListener('submit', e => { if (e.target.id === 'typeform') { e.preventDefault(); sessionAct('type'); } });
/* Reading: select text to save a word */
function hideSel(){ const b = document.getElementById('selbtn'); if (b) b.remove(); }
function selText(){ const sel = window.getSelection(); if (!sel || sel.isCollapsed) return null; const box = $('#rtext'); if (!box || !box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) return null; const t = sel.toString().replace(/\s+/g,' ').trim().replace(/^[^\w']+|[^\w']+$/g,''); return t && t.length <= 60 && t.split(' ').length <= 7 ? {t, rect: sel.getRangeAt(0).getBoundingClientRect()} : null; }
function showSel(){
  hideSel(); if (S.view !== 'article') return;
  const s = selText(); if (!s) return;
  const b = document.createElement('button'); b.id = 'selbtn'; b.className = 'btn primary sm'; b.dataset.act = 'save-sel'; b.dataset.t = s.t;
  b.innerHTML = `${ic('plus')} Save “${esc(s.t.length > 24 ? s.t.slice(0,24) + '…' : s.t)}”`;
  b.style.left = Math.max(8, Math.min(window.innerWidth - 220, s.rect.left)) + 'px'; b.style.top = Math.max(8, s.rect.top - 44) + 'px';
  document.body.appendChild(b); drawIcons();
}
function saveSelection(){
  const b = document.getElementById('selbtn'); const a = Store.get(S.artId); if (!b || !a) return;
  const term = b.dataset.t; hideSel();
  itemForm(null, {col: term.split(' ').length > 1 ? 'collocations' : 'vocabulary', term, examples: sentenceAround(a.text || '', term), context: a.title + (a.source ? ' (' + a.source + ')' : ''), category: a.topic || '', articleId: a.id});
}
document.addEventListener('mouseup', e => { if (e.target.closest('#selbtn')) return; setTimeout(showSel, 10); });
document.addEventListener('keyup', e => { if (e.shiftKey && S.view === 'article') showSel(); });

});
