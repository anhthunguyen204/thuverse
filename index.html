<style>
/* =========================================================
   Thuverse — design system v4
   Bright canvas · light grey rails · one vivid indigo · playful outlined tiles
   ========================================================= */
:root{
  --bg:#FFFFFF; --side:#F7F7F8; --surface:#FFFFFF; --surface-2:#F5F5F6; --surface-3:#EDEDEF;
  --border:#E7E7EA; --border-2:#F0F0F2; --border-strong:#D5D5DA;
  --text:#121216; --text-2:#55555E; --muted:#8B8B94;
  --primary:#4B3BE6; --primary-h:#3D2DD4; --primary-soft:#EFEDFF; --primary-ink:#3A2BC4; --on-primary:#FFFFFF;
  --yellow:#F5C518; --yellow-soft:#FFF5D1;
  --blue:#2F7BF5; --blue-soft:#E7F0FE;
  --green:#1F9D55; --green-soft:#E3F5EA;
  --red:#E5484D; --red-soft:#FDECEC;
  --amber:#C98500; --amber-soft:#FCF1D9;
  --pink:#E54C8E;
  /* illustration fills (outlined tiles) */
  --ill-blue:#4C8DFF; --ill-indigo:#8D7CFF; --ill-teal:#2CC7B0; --ill-amber:#F7D54A; --ill-coral:#FF7B5C; --outline:#121216;
  /* charts (validated: light, white surface) */
  --c-learning:#C98500; --c-review:#2F7BF5; --c-mastered:#1F9D55; --c-new:#E7E7EA; --c-new-ink:#9A9AA3; --c-line:#4B3BE6;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-ipa:'Gentium Book Plus','Charis SIL','Doulos SIL',serif;
  /* aliases kept for templates */
  --f-serif:var(--f-ui); --ink:var(--text); --ink-2:var(--text-2); --rule:var(--border); --rule-2:var(--border-2);
  --sheet:var(--surface); --sheet-2:var(--surface-2); --paper:var(--bg); --pen:var(--red); --leaf:var(--green); --sky:var(--primary); --hl:var(--yellow);
  --pen-soft:var(--red-soft); --leaf-soft:var(--green-soft); --sky-soft:var(--primary-soft); --hl-soft:var(--yellow-soft);
  --shadow-pop:0 18px 40px -18px rgba(18,18,22,.28);
}
[data-theme=dark]{
  --bg:#0E0E11; --side:#131317; --surface:#17171B; --surface-2:#1E1E23; --surface-3:#27272D;
  --border:#2A2A31; --border-2:#222228; --border-strong:#3A3A43;
  --text:#F3F3F5; --text-2:#B5B5BE; --muted:#80808A;
  --primary:#8B7FFF; --primary-h:#9D93FF; --primary-soft:#26224A; --primary-ink:#B9B2FF; --on-primary:#0E0E11;
  --yellow:#F5C518; --yellow-soft:#3A3214; --blue:#5B93F0; --blue-soft:#1C2A44; --green:#3BA86A; --green-soft:#16301F;
  --red:#F2686C; --red-soft:#3A1B1D; --amber:#D6A23E; --amber-soft:#33280F; --pink:#EE6AA2;
  --outline:#050507;
  --c-learning:#B98A2E; --c-review:#5B93F0; --c-mastered:#3BA86A; --c-new:#2A2A31; --c-new-ink:#80808A; --c-line:#8B7FFF;
  --shadow-pop:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15.5px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
::selection{background:var(--primary-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- icons */
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px;stroke-width:1.75}
svg.lucide{flex:none}

/* ---------- app frame */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}
.mark{width:36px;height:36px;flex:none}
.mark svg{display:block}
.mark .mk-bg{fill:var(--text)}.mark .mk-t{fill:var(--bg)}.mark .mk-dot{fill:var(--primary)}
[data-theme=dark] .mark .mk-dot{fill:#4B3BE6}
.brand-name{font:800 19px/1.15 var(--f-ui);letter-spacing:-.025em}
.brand-sub{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text-2);font-size:15.5px;font-weight:500}
.nav-item .ic{width:20px;height:20px;color:var(--text-2)}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.on{background:var(--surface-3);color:var(--text);font-weight:650}
.nav-item.on .ic{color:var(--text);stroke-width:2.1}
.badge{margin-left:auto;background:var(--primary);color:var(--on-primary);font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;line-height:20px;min-width:20px;text-align:center}
.navgroup{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}
.navgroup::after{content:"";flex:1;height:1px;background:var(--border)}
.subnav{display:flex;flex-direction:column;margin:2px 0 8px 22px;padding-left:10px;border-left:1px solid var(--border)}
.subnav a{font-size:14px;color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.subnav a span{display:inline-flex;align-items:center;gap:8px}
.subnav a:hover{background:var(--surface-3);color:var(--text)}
.subnav a.on{color:var(--primary);font-weight:650}
.subnav .ic{width:15px;height:15px}
.subnav small{font-size:12px;color:var(--muted)}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sync{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;padding:4px 12px}
.sync-ic .ic{width:14px;height:14px}
.sync.ok .sync-ic{color:var(--green)}.sync.err .sync-ic{color:var(--red)}.sync.wait .sync-ic{color:var(--amber)}

.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;gap:14px;align-items:center;padding:14px 36px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:12px;height:44px;padding:0 14px 0 40px}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top .grow{flex:1}
.topstats{display:flex;align-items:center;gap:18px}
.tstat{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;color:var(--text)}
.tstat .ic{width:20px;height:20px}
.t-zap{color:var(--yellow);fill:var(--yellow)}
.t-due{color:var(--primary)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:700;text-decoration:none}
.menu-btn{display:none}
.view{padding:36px 40px 80px;max-width:1300px;width:100%}

/* ---------- primitives */
.btn{height:42px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:0 18px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn .ic{width:17px;height:17px}
.btn.primary,.btn.hl{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover,.btn.hl:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--red)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.sm .ic{width:15px;height:15px}
.btn.lg{height:50px;padding:0 22px;font-size:16px;border-radius:14px}
.btn.block{width:100%;margin-bottom:10px;white-space:normal;height:auto;min-height:50px;padding-top:10px;padding-bottom:10px;text-align:center;line-height:1.3}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;cursor:pointer;display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.link{color:var(--primary);font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font-size:14.5px}
.link:hover{text-decoration:underline}
.mi{display:inline-flex;align-items:center;gap:6px}
.mi .ic{width:16px;height:16px}
.si{display:flex;align-items:center;gap:10px}
.si .ic{width:20px;height:20px;color:var(--muted)}
.eyebrow{display:block;font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--text-2);white-space:nowrap;border:0}
.chip .ic{width:13px;height:13px}
.chip.sk{background:var(--primary-soft);color:var(--primary-ink)}
.chip.tag,.chip.f{cursor:pointer;border:1px solid var(--border);background:var(--surface)}
.chip.f{font-size:14px;padding:6px 12px;border-radius:10px}
.chip.tag.on,.chip.f.on{background:var(--surface-3);border-color:var(--border-strong);color:var(--text)}
.pill,.wst{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:3px 10px;border-radius:999px;border:0;white-space:nowrap}
.pill{cursor:pointer}
.pill .ic,.wst .ic{width:13px;height:13px}
.pill.new,.wst{background:var(--surface-3);color:var(--text-2)}
.pill.learning,.wst.learning{background:var(--amber-soft);color:var(--amber)}
.pill.mastered,.wst.mastered,.wst.known{background:var(--green-soft);color:var(--green)}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:16px}
.muted{color:var(--muted)}
mark,.hlmark{background:var(--primary-soft);color:var(--primary-ink);padding:0 3px;border-radius:4px}
.pbar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden;display:flex;flex:1}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.pbar i.l{background:var(--c-learning);border-radius:0}
.pbar i.m{background:var(--c-mastered);border-radius:0}
.pbar.lg{height:8px}
kbd{font:600 11px/1 var(--f-ui);border:1px solid currentColor;border-radius:5px;padding:2px 5px;opacity:.55;margin-left:6px}

h1.page{font:750 36px/1.15 var(--f-ui);letter-spacing:-.025em;margin:4px 0 8px}
h1.page.xl{font-size:44px;letter-spacing:-.03em}
.lede{color:var(--text-2);font-size:17px;margin:0 0 26px;max-width:66ch}
h2.sec{font:700 20px/1.3 var(--f-ui);letter-spacing:-.015em;margin:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head a{font-size:14.5px;color:var(--primary);font-weight:600;text-decoration:none}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;min-width:0}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);min-width:0}
.empty{border:1px dashed var(--border-strong);border-radius:20px;padding:36px 28px;text-align:center;color:var(--text-2);background:var(--surface)}
.empty h3{font:700 18px var(--f-ui);margin:0 0 6px;color:var(--text)}
.empty p{margin:0 0 16px}
.empty>.ic{display:block;margin:0 auto 10px;width:30px;height:30px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap}
.tab:hover{border-color:var(--border-strong);color:var(--text)}
.tab.on{background:var(--surface-3);border-color:var(--border-strong);color:var(--text);font-weight:650}
.tab .ic{width:16px;height:16px;color:var(--muted)}
.tab.on .ic{color:var(--text)}
.tab small{color:var(--muted);font-weight:500;font-size:13px}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button,.seg label span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.seg label{padding:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg button:hover,.seg label:hover span{border-color:var(--border-strong)}
.seg .on,.seg input:checked+span{background:var(--surface-3);border-color:var(--border-strong);color:var(--text);font-weight:650}
.seg label:has(input:focus-visible) span{outline:2px solid var(--primary)}
.seg .ic{width:15px;height:15px;color:var(--muted)}
.seg .on .ic,.seg input:checked+span .ic{color:var(--text)}
.seg-sm button{padding:5px 11px;font-size:13.5px}
.legend{display:flex;gap:16px;font-size:13.5px;color:var(--text-2);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:7px;vertical-align:-1px}

/* playful outlined tiles — echoing the flat, outlined illustrations */
.tile{width:52px;height:52px;border-radius:14px;display:inline-grid;place-items:center;flex:none;background:var(--ill-indigo);color:var(--outline);border:2px solid var(--outline);box-shadow:3px 3px 0 var(--outline)}
.tile .ic{width:24px;height:24px;stroke-width:2.1}
.tile.sm{width:34px;height:34px;border-radius:10px;box-shadow:2px 2px 0 var(--outline);border-width:1.75px}
.tile.sm .ic{width:17px;height:17px}
.t-blue .tile,.tile.t-blue{background:var(--ill-blue)}
.t-indigo .tile,.tile.t-indigo{background:var(--ill-indigo)}
.t-teal .tile,.tile.t-teal{background:var(--ill-teal)}
.t-amber .tile,.tile.t-amber{background:var(--ill-amber)}
.t-coral .tile,.tile.t-coral{background:var(--ill-coral)}
.coll-ic{width:46px;height:46px;border-radius:13px;display:inline-grid;place-items:center;background:var(--ill-indigo);color:var(--outline);border:2px solid var(--outline);box-shadow:3px 3px 0 var(--outline);flex:none}
.coll-ic .ic{width:22px;height:22px;stroke-width:2.1}
.tic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);flex:none}
.tic .ic{width:22px;height:22px}

/* ---------- dashboard */
.d3{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.d3-main{min-width:0}
.d3-rail{display:grid;gap:18px;position:sticky;top:96px}
.dhead{margin:0 0 34px}
.dhead h1{font:750 34px/1.15 var(--f-ui);letter-spacing:-.025em;margin:0 0 6px}
.dhead p{margin:0;color:var(--text-2);font-size:16.5px}
.goal{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.goal .pbar{max-width:320px}
.goal-n{font-weight:700}
.goal-s{color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.goal-s .ic{width:15px;height:15px}
.block{margin-bottom:44px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.block-h h2{font:700 22px/1.25 var(--f-ui);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
.block-h h2 .ic{width:20px;height:20px;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.task{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.task:nth-child(1) .tic{background:var(--blue-soft);color:var(--blue)}
.task:nth-child(2) .tic{background:var(--primary-soft);color:var(--primary)}
.task:nth-child(3) .tic{background:var(--amber-soft);color:var(--amber)}
.task:nth-child(4) .tic{background:var(--red-soft);color:var(--red)}
.task.done .tic{background:var(--green-soft)!important;color:var(--green)!important}
.task b{display:block;font-size:16px;font-weight:650}
.task small{color:var(--text-2);font-size:14px}
.task small a{color:var(--primary);text-decoration:none;font-weight:600}
.task.done b{color:var(--text-2)}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px}
.rcard>h3{font:700 17px var(--f-ui);margin:0 0 14px;letter-spacing:-.01em}
.streakcard .sc-top{display:flex;justify-content:space-between;align-items:flex-start}
.streakcard h3{font:750 21px var(--f-ui);margin:0;letter-spacing:-.02em}
.streakcard p{margin:4px 0 0;color:var(--muted);font-size:14px}
.streakcard .bolt .ic{width:46px;height:46px;color:var(--yellow);fill:var(--yellow);transform:rotate(8deg)}
.sc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:18px}
.sc-d{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:12px}
.sc-d.today{background:var(--surface-2)}
.sc-d i{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center}
.sc-d.on i{background:var(--yellow);color:#fff}
.sc-d.on i .ic{width:16px;height:16px;stroke-width:3}
.sc-d.future i{opacity:.55}
.sc-d b{font-size:13px;font-weight:500;color:var(--muted)}
.sc-d.today b{color:var(--text);font-weight:700}
.ovl{list-style:none;margin:0;padding:0}
.ovl a{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--border-2);text-decoration:none}
.ovl li:first-child a{border-top:0;padding-top:0}
.ovl .oi{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2)}
.ovl span{font-size:14.5px;font-weight:550}
.ovl small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.ovl small .pbar{width:120px;margin-top:6px}
.ovl b{font:750 20px var(--f-ui);font-variant-numeric:tabular-nums}
.ovl em{font-style:normal;font-size:14px;color:var(--muted);font-weight:500}
.ielts-bands{display:block;margin-top:14px;padding:14px;border-radius:14px;background:var(--surface-2);text-decoration:none}
.ib-h{display:flex;align-items:center;gap:7px;font-weight:650;font-size:14px}
.ib-h .ic{width:16px;height:16px;color:var(--text-2)}
.ib-h em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:500;font-size:13px}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.bands span{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.bands .ic{width:16px;height:16px}
.bands b{font:750 17px var(--f-ui);color:var(--text)}
.quick2{display:grid;gap:8px}
.qbtn{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-size:14.5px;font-weight:600;text-align:left}
.qbtn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.qbtn .ic{width:18px;height:18px;color:var(--primary)}
.cont{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 18px;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-decoration:none;cursor:pointer}
.crow:hover{border-color:var(--border-strong)}
.crow>svg:first-child,.crow>i:first-child{width:44px;height:44px;padding:11px;border-radius:12px;background:var(--primary-soft);color:var(--primary)}
.crow b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{color:var(--muted);font-size:13.5px}
.crow .chev{color:var(--muted)}

/* vocabulary progress */
.vp{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.vp-main{padding:22px 24px}
.vp-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.vp .panel{padding:20px 22px}
.vp-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.vp-hero .v{font:800 40px/1 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.vp-hero .l{color:var(--text-2);font-weight:500}
.vp-hero .delta{margin-left:auto;font-size:13.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);padding:4px 10px;border-radius:999px;font-weight:600}
.vp-hero .delta .ic{width:15px;height:15px;color:var(--green)}
.mini-h{font:650 14px var(--f-ui);color:var(--text);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.mini-h .ic{width:16px;height:16px;color:var(--muted)}
.chart{position:relative;outline-offset:4px;border-radius:8px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--border-2);stroke-width:1}
.chart .base{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--muted);font:11.5px var(--f-ui)}
.chart .axis.today{fill:var(--text);font-weight:700}
.chart .line{fill:none;stroke:var(--c-line);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--c-line);opacity:.08}
.chart .end{fill:var(--c-line);stroke:var(--surface);stroke-width:2.5}
.chart .hot{fill:var(--surface);stroke:var(--c-line);stroke-width:2.25}
.chart .cross{stroke:var(--text-2);stroke-width:1;stroke-dasharray:3 3}
.chart .col{fill:transparent}
.chart .col.on{fill:var(--surface-2)}
.chart .b-new{fill:var(--c-learning)}
.chart .b-rev{fill:var(--c-review)}
.ctip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 11px;box-shadow:var(--shadow-pop);white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.ctip b{font-size:14.5px;color:var(--text)}
.ctip span{font-size:12.5px;color:var(--text-2)}
.ctip small{font-size:12px;color:var(--muted)}
.tview{margin-top:10px;font-size:13.5px}
.tview summary{cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;list-style:none;font-weight:500}
.tview summary::-webkit-details-marker{display:none}
.tview summary .ic{width:15px;height:15px}
.tview table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.tview th{text-align:left;color:var(--muted);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--border)}
.tview td{padding:5px 6px;border-bottom:1px solid var(--border-2)}
.segbar{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;margin-bottom:14px}
.segbar i{display:block;min-width:4px}
.slist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
.slist li{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;font-size:14px}
.slist .sk-ic{display:grid;place-items:center}
.slist .sk-ic .ic{width:17px;height:17px}
.slist .sl small{color:var(--muted);font-size:12.5px;margin-left:6px}
.slist b{font-variant-numeric:tabular-nums;font-weight:700}
.legend.wl{margin-bottom:8px;font-size:13px}
.legend.wl b{margin-left:3px}

/* ---------- library & collection cards */
.lib-sec{margin-bottom:46px}
.lib-sec>h2{font:750 24px var(--f-ui);letter-spacing:-.02em;margin:0 0 6px;display:flex;gap:12px;align-items:center}
.lib-sec>p{color:var(--text-2);margin:0 0 18px}
.sub-h{font-size:15px;font-weight:650;color:var(--text);margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sub-h .ic{width:17px;height:17px;color:var(--muted)}
.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.colls.compact{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.coll{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:22px;background:var(--surface);padding:10px;text-decoration:none;min-width:0;transition:border-color .12s}
.coll:hover{border-color:var(--border-strong)}
.coll .media{position:relative;height:150px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center}
.coll .media .tile{width:76px;height:76px;border-radius:20px;border-width:2.5px;box-shadow:5px 5px 0 var(--outline);transform:rotate(-4deg)}
.coll .media .tile .ic{width:34px;height:34px}
.coll:hover .media .tile{transform:rotate(0)}
.cstat{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.cstat .ic{width:13px;height:13px}
.cstat.ok{color:var(--green)}
.cbody{padding:16px 12px 10px;min-width:0;display:flex;flex-direction:column;flex:1}
.cbody>b{font:700 18px/1.3 var(--f-ui);letter-spacing:-.015em;display:block;margin:6px 0 6px}
.cbody p{margin:0 0 14px;color:var(--text-2);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--text-2);margin-bottom:12px}
.cmeta span{display:inline-flex;gap:5px;align-items:center}
.cmeta .ic{width:15px;height:15px;color:var(--muted)}
.cmeta.lg{font-size:15px;gap:20px;margin:18px 0 0}
.cmeta.lg .ic{width:17px;height:17px}
.cprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:auto}
.cprog span{white-space:nowrap}
.coll.compact{flex-direction:row;align-items:center;gap:14px;padding:14px;border-radius:18px}
.coll.compact .tile{width:46px;height:46px;border-radius:13px}
.coll.compact .tile .ic{width:21px;height:21px}
.coll.compact .cbody{padding:0}
.coll.compact .cbody>b{font-size:16px;margin:0 0 4px}
.coll.compact .cbody p{-webkit-line-clamp:1;margin:0 0 6px;font-size:13.5px}
.coll.compact .cmeta{margin-bottom:8px;font-size:12.5px;gap:10px}
.coll.compact .cmeta .ic{width:13px;height:13px}
.coll.compact .cstat{position:static;padding:0;border:0;background:none;font-size:12.5px}

/* collection page (course-page layout) */
.crumb{font-size:14.5px;color:var(--muted);margin:0 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--text-2);text-decoration:none}
.crumb a:hover{color:var(--primary)}
.crumb .ic{width:14px;height:14px}
.cpage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:44px;align-items:start}
.cmain{min-width:0}
.crail{position:sticky;top:96px}
.crail .rcard{padding:12px 12px 20px}
.crail .rcard>*:not(.media){margin-left:10px!important;margin-right:10px!important}
.media.big{height:200px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center;margin-bottom:18px}
.media.big .tile{width:96px;height:96px;border-radius:24px;border-width:2.5px;box-shadow:6px 6px 0 var(--outline);transform:rotate(-4deg)}
.media.big .tile .ic{width:42px;height:42px}
.crail h3{font:700 16px var(--f-ui);margin:0 0 12px}
.crail .cprog{margin:0 0 16px;font-size:13.5px}
.crail .slist{margin:0 10px 18px}
.crail .btn.block{width:calc(100% - 20px)}
.syl-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px;flex-wrap:wrap}
.syl-h h2{font:750 22px var(--f-ui);letter-spacing:-.02em;margin:0}
.syl{display:grid;gap:14px}
.lrow{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-decoration:none}
.lrow:hover{border-color:var(--border-strong)}
.lrow.current{border:2.5px solid var(--primary);padding:13px 17px}
.lrow .tile{width:52px;height:52px;box-shadow:none;border:0;background:var(--surface-2)!important;color:var(--text-2)}
.lrow.current .tile{background:var(--primary-soft)!important;color:var(--primary)}
.lrow.done .tile{background:var(--green-soft)!important;color:var(--green)}
.lmain{min-width:0}
.lmain b{display:block;font:700 17px var(--f-ui);margin:2px 0}
.lsum{display:block;color:var(--text-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600}
.lmeta .ic{width:15px;height:15px}
.bubble{position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px;padding:6px 14px;border-radius:11px;box-shadow:var(--shadow-pop)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.lnum{font:700 18px var(--f-ui);color:var(--muted);text-align:center}
.wlist{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 12px 12px 20px;border-top:1px solid var(--border-2);cursor:pointer}
.wrow:first-child{border-top:0}
.wrow:hover{background:var(--surface-2)}
.wt{font:700 16.5px var(--f-ui);letter-spacing:-.01em}
.pos{font-style:italic;font-size:13.5px;color:var(--muted);margin-left:7px}
.wvi{color:var(--text-2);font-size:14.5px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fsearch,.toolbar select{border:1px solid transparent;background:var(--surface-2);border-radius:12px;height:42px;padding:0 14px}
textarea.fsearch{height:auto;padding:12px 14px}
.fsearch:focus,.toolbar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.sbox{position:relative;flex:1;min-width:200px;display:flex}
.sbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.sbox .fsearch{padding-left:38px;width:100%}
.sel{position:relative;display:inline-flex}
.sel .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.sel select{padding-left:34px}
.tagcloud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tagcloud .chip .muted{font-weight:500}

/* ---------- My Knowledge entries */
.dict{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 20px;border-top:1px solid var(--border-2);cursor:pointer}
.entry:first-child{border-top:0}
.entry:hover{background:var(--surface-2)}
.entry .hw{font:700 18px/1.35 var(--f-ui);letter-spacing:-.01em}
.entry .hw .ipa{font-weight:400;margin-left:8px}
.entry .hw .ctype{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-left:10px}
.entry .gloss{color:var(--text-2);font-size:15px;margin-top:2px}
.entry .gloss .vi{color:var(--text);font-weight:500}
.entry .ex{font-style:italic;font-size:14.5px;color:var(--muted);margin-top:4px}
.entry .side-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.entry .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.entry.mistake .hw>span:first-child{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.entry.mistake .gloss .fix{color:var(--green);font-weight:650}
.more{text-align:center;padding:16px}
.mini{display:flex;flex-direction:column}
.mini .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border-2);cursor:pointer;text-decoration:none}
.mini .r:first-child{border-top:0}
.mini .r .w{font:650 15.5px var(--f-ui);flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r .m{color:var(--muted);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r .d{font-size:12.5px;color:var(--muted);flex:none}
.mini .r:hover .w{color:var(--primary)}
.kind{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);flex:none;width:78px}
.group-h{font:700 16px var(--f-ui);margin:24px 0 10px;color:var(--text)}
.srgroup h3{font:700 17px var(--f-ui);margin:26px 0 10px}

/* ---------- IELTS workspace */
.skilltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.skilltabs a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:14.5px;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:500}
.skilltabs a:hover{border-color:var(--border-strong)}
.skilltabs a.on{background:var(--surface-3);border-color:var(--border-strong);color:var(--text);font-weight:650}
.skilltabs .ic{width:16px;height:16px}
.skilltabs .gap{width:10px}
.skhero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-bottom:26px}
.skhero h1{font:750 34px/1.15 var(--f-ui);letter-spacing:-.025em;margin:0 0 10px}
h1.ih{display:flex;align-items:center;gap:16px}
.skhero p{margin:0 0 14px;color:var(--text-2);max-width:62ch}
.prog .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog .big{font:800 36px/1 var(--f-ui);letter-spacing:-.03em}
.prog svg{display:block;width:100%;height:70px;margin:12px 0}
.counts{display:flex;gap:18px;font-size:14.5px;color:var(--text-2);flex-wrap:wrap}
.counts b{color:var(--text)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.note{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note h4{font:700 16.5px/1.4 var(--f-ui);margin:0}
.note .nh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.note .acts{display:flex;flex:none;opacity:.6}
.note:hover .acts,.note:focus-within .acts{opacity:1}
.note .acts .icon-btn{width:30px;height:30px}
.note .body{font-size:15px;color:var(--text-2);overflow-wrap:anywhere}
.note details{border-top:1px solid var(--border-2);padding-top:10px}
.note summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--primary);display:flex;align-items:center;gap:6px}
.note summary .ic{width:16px;height:16px}
.note .ans{font-size:15.5px;line-height:1.7;margin-top:8px;overflow-wrap:anywhere}
.note .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.note a.url{color:var(--primary);font-size:14px;overflow-wrap:anywhere;text-decoration:none}
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.topic h4{font:700 17px var(--f-ui);margin:0 0 4px}
.topic ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;color:var(--text-2)}
.topic li{margin:4px 0}
.topic li small{color:var(--muted)}
.scores{width:100%;border-collapse:collapse;font-size:14.5px}
.scores td{padding:10px 6px;border-top:1px solid var(--border-2)}
.scores tr:first-child td{border-top:0}
.scores td.b{font-weight:750;font-variant-numeric:tabular-nums}

/* ---------- review */
.rhero{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:16px}
.rhero .v{font:800 48px/1 var(--f-ui);letter-spacing:-.03em;display:block}
.rhero .l{color:var(--text-2);font-size:14.5px}
.rhero .l .ic{color:var(--primary)}
.rcontrols{display:flex;gap:18px;flex-wrap:wrap;flex:1}
.rcontrols .fld{gap:6px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:30px}
.deck{border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:16px 18px;text-align:left;cursor:pointer}
.deck:hover{border-color:var(--border-strong)}
.deck:disabled{opacity:.5;cursor:default}
.deck .deck-t{display:flex;gap:8px;align-items:center;font-weight:650;font-size:15px}
.deck .deck-t .ic{color:var(--primary);width:17px;height:17px}
.deck .n{display:block;font:800 30px/1.25 var(--f-ui);letter-spacing:-.02em;margin-top:6px}
.deck .n.due{color:var(--primary)}
.deck small{color:var(--muted);font-size:13px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:34px;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
.week div:first-child i{opacity:1}
.week span{font-size:12px;color:var(--muted)}
.week b{font-size:12.5px}

/* ---------- study session (flashcards) */
.study{max-width:640px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-size:14px;color:var(--muted)}
.sbar .track{flex:1;height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.sbar .track i{display:block;height:100%;background:var(--primary);border-radius:999px}
.scard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:62px 36px 32px;margin-top:58px;min-height:240px;display:flex;flex-direction:column;text-align:center}
.scard.flip{cursor:pointer}
.sbadge{position:absolute;top:-48px;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:var(--surface-2);border:6px solid var(--bg);display:grid;place-items:center;color:var(--primary)}
.sbadge .ic{width:38px;height:38px;stroke-width:1.9}
.sbadge.static{position:static;transform:none;margin:0 auto;border-color:var(--surface);background:var(--green-soft);color:var(--green)}
.stop{display:flex;justify-content:center;align-items:center;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;gap:8px}
.stop>span:first-child{display:inline-flex;gap:7px;align-items:center}
.stop>span:first-child .ic{width:15px;height:15px}
.stop>:last-child:not(:first-child){position:absolute;top:14px;right:14px;text-transform:none;letter-spacing:0;font-weight:500;display:flex;gap:2px}
.sterm{font:800 40px/1.2 var(--f-ui);letter-spacing:-.025em;margin:16px 0 4px;overflow-wrap:anywhere}
.scard .ipa{font-size:19px}
.scard .pos{margin:0}
.svi{font:700 21px/1.4 var(--f-ui);margin-top:14px}
.sdef{color:var(--text-2);margin-top:4px}
.sex{margin:18px 0 0;padding:14px 18px;border-radius:16px;background:var(--surface-2);font-style:italic;font-size:16.5px;line-height:1.6;color:var(--text-2)}
.sex .icon-btn{width:28px;height:28px;vertical-align:middle}
.sback{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);animation:rise .2s ease-out}
.scard .hint{margin-top:auto;padding-top:24px;color:var(--muted);font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blank{display:inline-block;border-bottom:2px solid var(--text);min-width:64px;color:transparent}
.sacts{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.sacts .btn{height:50px;border-radius:14px;padding:0 22px;font-size:16px}
.sopts{display:grid;gap:10px;margin-top:22px}
.sopt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:16px}
.sopt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.sopt kbd{margin:0}
.sopt:disabled{cursor:default}
.sopt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:650}
.sopt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.typebox{display:flex;gap:8px;margin-top:22px}
.typebox input{flex:1;min-width:0;font:700 21px var(--f-ui);padding:0 16px;height:54px;border:1px solid transparent;border-radius:14px;background:var(--surface-2);text-align:center}
.typebox input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.typebox .btn{height:54px;border-radius:14px}
.fb{margin-top:16px;padding:12px 14px 12px 18px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15.5px;font-weight:550}
.fb>span:first-child{display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.fb .icon-btn{color:inherit}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.rate{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:12px 10px;cursor:pointer;text-align:center}
.rate b{display:block;font-size:15px}
.rate small{color:var(--muted);font-size:12.5px}
.rate.r0{color:var(--red)}
.rate.r0:hover{background:var(--red-soft);border-color:var(--red)}
.rate.r1:hover{background:var(--amber-soft);border-color:var(--amber)}
.rate.r2:hover{background:var(--green-soft);border-color:var(--green)}
.rate.r3:hover{background:var(--primary-soft);border-color:var(--primary)}

/* ---------- grammar lesson */
.lesson{max-width:760px}
.lesson h2.si{font:750 22px var(--f-ui);letter-spacing:-.02em;margin:36px 0 12px}
.lesson .txt p{font-size:16.5px;line-height:1.75;margin:0 0 12px;max-width:68ch}
.formt{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.formt td{padding:12px 16px;border-top:1px solid var(--border-2);vertical-align:top}
.formt tr:first-child td{border-top:0}
.formt td:first-child{font-weight:650;width:34%;background:var(--surface-2)}
.exlist{list-style:none;padding:0;margin:0;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.exlist li{display:flex;gap:8px;align-items:center;padding:8px 14px 8px 8px;border-top:1px solid var(--border-2);font-style:italic;font-size:16px}
.exlist li:first-child{border-top:0}
.mist{display:grid;gap:10px}
.mist>div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 18px}
.mist .w{color:var(--red);text-decoration:line-through}
.mist .r{color:var(--green);font-weight:650;display:inline-flex;align-items:center;gap:6px}
.mist .r .ic{width:16px;height:16px}
.mist small{display:block;color:var(--text-2);font-size:14px;margin-top:4px}
.q{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-bottom:12px}
.q>p{margin:0 0 12px;font-weight:600;font-size:16.5px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px}
.qopt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.qopt:disabled{cursor:default;opacity:.6}
.qopt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:650;opacity:1}
.qopt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);opacity:1}
.qfb{font-size:14.5px;margin-top:10px;color:var(--text-2)}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--primary-soft);border-radius:18px;padding:18px 20px;margin-top:8px}
.lnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--border)}

/* ---------- reading */
.arow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--border-2);text-decoration:none}
.arow:first-child{border-top:0}
.arow:hover{background:var(--surface-2)}
.arow .tic{background:var(--red-soft);color:var(--red)}
.athumb{position:relative;width:96px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border-2);display:grid;place-items:center;color:var(--muted);flex:none}
.athumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.athumb.lg{width:132px}
.athumb .ph>.ic{width:22px;height:22px}
.sic{position:relative;width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;overflow:hidden;flex:none;font:750 19px var(--f-ui)}
.sic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9px;background:var(--surface);box-sizing:border-box;border:1px solid var(--border-2);border-radius:inherit}
.sic.sm{width:32px;height:32px;border-radius:9px;font-size:15px}.sic.sm img{padding:6px}
.sic.xs{width:20px;height:20px;border-radius:6px;font-size:11px;vertical-align:-5px;margin-right:6px}.sic.xs img{padding:2px}
.asrc{display:inline-flex;align-items:center}
.scats{margin:-4px 0 18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.srccard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:16px;padding:18px 18px 16px}
.srccard-h{display:flex;gap:12px;align-items:center}
.srccard h3{font:700 17px/1.25 var(--f-ui);margin:0;overflow-wrap:anywhere}
.shost{font-size:13px;color:var(--muted)}
.srccard-x{display:flex;margin:-6px -8px 0 0}
.srccard>p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.5;flex:1}
.srccard-tags{display:flex;gap:6px;flex-wrap:wrap}
.srccard-f{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border-2)}
.apreview{display:flex;gap:14px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin:-2px 0 12px}
.apreview[hidden]{display:none}
.ap-t{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.fmeta{font-size:13.5px;color:var(--text-2);margin:0}
.fmeta:empty{display:none}
.fmeta.busy{color:var(--muted)}.fmeta.ok{color:var(--green)}.fmeta.warn{color:var(--amber)}
#src-form .fmeta{margin:-6px 0 12px}
.ahero{margin:16px 0 0;aspect-ratio:1.91/1;max-height:380px;width:100%;border-radius:18px;overflow:hidden;background:var(--surface-2)}
.ahero img{width:100%;height:100%;object-fit:cover;display:block}
.ahero:not(:has(img)){display:none}
@media (max-width:640px){.arow{grid-template-columns:64px minmax(0,1fr)}.arow>div:last-child{grid-column:2;text-align:left!important}.athumb{width:64px}.sgrid{grid-template-columns:1fr}}
.reader{max-width:740px}
.reader h1{font:750 36px/1.2 var(--f-ui);letter-spacing:-.025em;margin:4px 0 10px}
.rtext{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 34px}
.rtext p{font-size:18px;line-height:1.8;margin:0 0 16px;max-width:66ch}
.rtext p:last-child{margin-bottom:0}
.rtext ::selection{background:var(--primary-soft);color:var(--primary-ink)}
#selbtn{position:fixed;z-index:120;box-shadow:var(--shadow-pop)}
.jmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 0;color:var(--muted);font-size:14px}
.jmeta .link{display:inline-flex;gap:5px;align-items:center}
.jmeta .ic{width:15px;height:15px}

/* ---------- journal */
.jgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.jlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;max-height:72vh;overflow-y:auto}
.jlist button{border:0;border-top:1px solid var(--border-2);background:none;text-align:left;padding:13px 16px;cursor:pointer;display:block;width:100%}
.jlist button:first-child{border-top:0}
.jlist button:hover{background:var(--surface-2)}
.jlist button.on{background:var(--primary-soft)}
.jlist b{font:650 15px var(--f-ui);display:flex;align-items:center;gap:6px}
.jlist small{color:var(--muted);font-size:13px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ic.mood{width:15px;height:15px;color:var(--muted)}
.jdoc{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 36px}
.jdoc h2{font:750 28px/1.2 var(--f-ui);letter-spacing:-.02em;margin:0}
.jdoc h3{font:700 16px var(--f-ui);margin:24px 0 8px}
.jdoc .txt{font-size:16.5px;line-height:1.75;max-width:70ch;overflow-wrap:anywhere}
.mood-l{display:inline-flex;align-items:center;gap:5px}
.monthstats{display:flex;gap:30px;flex-wrap:wrap}
.monthstats div b{font:800 26px var(--f-ui);letter-spacing:-.02em;display:block}
.monthstats span{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.monthstats .ic{width:15px;height:15px}

/* ---------- preferences */
.prefs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.prefs .panel h2{margin-bottom:16px}
.prefs .stack{display:flex;flex-direction:column;gap:14px}
textarea.code{font:13px/1.45 ui-monospace,Menlo,monospace;width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:10px}

/* ---------- modals, drawers, forms */
.overlay{position:fixed;inset:0;background:rgba(18,18,22,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;animation:fade .15s}
.overlay.drawer{justify-content:flex-end;padding:0}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:680px;box-shadow:0 30px 70px -24px rgba(0,0,0,.45);animation:pop .18s ease-out;border:1px solid var(--border)}
.modal.sm{max-width:440px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.drawer .modal{max-width:540px;min-height:100vh;border-radius:24px 0 0 24px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.form{padding:24px 28px 22px;display:flex;flex-direction:column;gap:15px}
.form-head{display:flex;justify-content:space-between;align-items:center}
.form-head h3{font:750 22px var(--f-ui);letter-spacing:-.02em;margin:0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13.5px;font-weight:600;color:var(--text-2)}
.fld>span em{font-weight:400;font-style:normal;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid transparent;background:var(--surface-2);border-radius:12px;padding:10px 14px;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.fld textarea{resize:vertical;line-height:1.5}
.fld.big input{font:700 22px var(--f-ui);padding:12px 14px;letter-spacing:-.01em}
.fld .ipa-in{font-family:var(--f-ipa);font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ipakeys{display:flex;flex-wrap:wrap;gap:4px;margin-top:-6px}
.ipakeys button{font:16px var(--f-ipa);border:1px solid var(--border);background:var(--surface);border-radius:8px;min-width:30px;height:30px;cursor:pointer;padding:0 6px}
.ipakeys button:hover{background:var(--primary-soft);border-color:var(--primary)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.pick input:checked+span{background:var(--primary-soft);color:var(--primary-ink);border-color:var(--primary);font-weight:650}
.pick input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.form-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;border-top:1px solid var(--border);margin-top:4px;padding-top:16px}
.form-foot .chk{margin-right:auto;font-size:14px;color:var(--text-2);display:flex;gap:7px;align-items:center}
.warn{font-size:13.5px;color:var(--amber);margin-top:2px}
.warn a{color:var(--primary);cursor:pointer;font-weight:650}
.detail{padding:24px 30px 30px}
.detail .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.detail .hw{font:800 34px/1.2 var(--f-ui);letter-spacing:-.025em;margin:4px 0 6px;overflow-wrap:anywhere}
.detail .vi{font:700 20px var(--f-ui);margin-top:14px}
.detail .def{color:var(--text-2);font-size:16px;margin-top:4px}
.detail h5{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.detail ol{margin:0;padding-left:22px;font-style:italic;font-size:16px;line-height:1.6}
.detail ol li{margin:4px 0}
.detail .notes-txt{background:var(--yellow-soft);padding:12px 14px;border-radius:12px;font-size:15px}
.detail .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14.5px}
.detail .facts dt{color:var(--muted)}
.detail .facts dd{margin:0}
.detail .dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
.confirm{padding:24px 26px}
.confirm h3{font:750 20px var(--f-ui);margin:0 0 8px}
.confirm p{margin:0 0 20px;color:var(--text-2)}
.confirm .row{display:flex;justify-content:flex-end;gap:8px}
.newwrap{position:relative}
.me-btn{border:0;padding:0;cursor:pointer;font:inherit;font-weight:700;flex:none}
.me-btn[aria-expanded=true]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.me-btn.alert{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--red)}
.mepop{position:fixed;z-index:90;width:280px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;outline:0}
.mepop[hidden]{display:none}
.mesub{width:200px;z-index:91}
.mp-acct{display:flex;gap:12px;align-items:center;padding:10px 10px 6px}
.mp-av{width:44px;height:44px;flex:none;font-size:18px}
.mp-who{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.mp-who b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-who small{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-edit{border:0;background:none;padding:2px 0;margin-top:2px;color:var(--primary);font:600 13px var(--f-ui);cursor:pointer;border-radius:4px}
.mp-edit:hover{text-decoration:underline}
.mp-sync{padding:2px 10px 8px}
.mp-sep{height:1px;background:var(--border);margin:4px 4px}
.mp-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;min-height:40px;border-radius:10px;cursor:pointer;font:500 14.5px var(--f-ui);color:var(--text)}
.mp-i span{flex:1}
.mp-i .ic{width:17px;height:17px;color:var(--muted);flex:none}
.mp-i small{color:var(--muted);font-size:13px}
.mp-i:hover,.mp-i:focus-visible,.mp-i.act{background:var(--surface-2);outline:0}
.mp-i:focus-visible{box-shadow:inset 0 0 0 2px var(--primary)}
.mp-i.on{font-weight:650}.mp-i.on>.ic:first-child,.mp-i .mp-chk{color:var(--primary)}
.mp-note{margin:4px 10px 6px;font-size:12.5px;color:var(--muted)}
.newmenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;min-width:260px;z-index:50}
.newmenu button,.newmenu a{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;justify-content:space-between;align-items:center}
.newmenu button span,.newmenu a{color:inherit;text-decoration:none;box-sizing:border-box}
.newmenu a span{display:inline-flex;align-items:center;gap:10px}
.newmenu button:hover,.newmenu a:hover{background:var(--surface-2)}
.newmenu .ic{width:17px;height:17px;color:var(--muted)}
.newmenu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.newmenu small{color:var(--muted)}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;box-shadow:var(--shadow-pop);animation:pop .2s}
.toast .ic{width:17px;height:17px;color:var(--green)}
.toast.err{background:var(--red);color:#fff}
.toast.err .ic{color:#fff}


/* ---------- dictionary lookup */
.modal.xl{max-width:1180px}
.lk{padding:22px 26px 6px}
.lk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lk-head h3{font:750 24px var(--f-ui);letter-spacing:-.02em;margin:0 0 4px}
.lk-head p{margin:0;color:var(--text-2)}
.lk-search{display:flex;gap:10px;margin:18px 0 16px}
.lk-search .sbox .fsearch{height:50px;font-size:17px;font-weight:600}
.lk-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.lk-res{background:var(--surface-2);border-radius:18px;padding:18px;min-height:220px;position:sticky;top:12px;max-height:calc(100vh - 140px);overflow-y:auto}
.lk-formcol .form{padding:0 0 18px}
.lk-intro{text-align:center;color:var(--text-2);padding:22px 10px}
.lk-intro>.ic{width:34px;height:34px;color:var(--primary);margin-bottom:8px}
.lk-intro h4{font:700 17px var(--f-ui);color:var(--text);margin:0 0 6px}
.lk-intro p{margin:0;font-size:14.5px}
.lk-loading{display:flex;align-items:center;gap:10px;padding:18px 4px;color:var(--text-2);font-weight:550}
.lk-loading .ic{animation:spin 1s linear infinite;color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.lk-note,.lk-dup{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.lk-note>.ic,.lk-dup>.ic{width:20px;height:20px;color:var(--amber);margin-top:1px}
.lk-dup>.ic{color:var(--primary)}
.lk-note b,.lk-dup b{display:block;font-weight:650}
.lk-note span,.lk-dup span{display:block;color:var(--text-2);font-size:14px}
.lk-dup{border-color:var(--primary);background:var(--primary-soft)}
.lk-dup.lib{border-color:var(--border);background:var(--surface)}
.lk-dup-a{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.lk-top h4{font:750 24px var(--f-ui);letter-spacing:-.02em;margin:0}
.lk-fields{list-style:none;margin:0 0 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.lk-fields li{display:grid;grid-template-columns:16px 1fr;gap:2px 7px;align-items:center;font-size:13.5px}
.lk-fields li .ic{width:15px;height:15px}
.lk-fields li.ok .ic{color:var(--green)}
.lk-fields li.no{color:var(--muted)}
.lk-fields li.no .ic{color:var(--muted)}
.lk-fields small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.3}
.lk-sec{margin-top:16px}
.lk-sec h5{display:flex;align-items:center;gap:7px;font:650 14px var(--f-ui);margin:0 0 8px;flex-wrap:wrap}
.lk-sec h5 .ic{width:16px;height:16px;color:var(--muted)}
.lk-sec h5 small{font-weight:500;color:var(--muted);font-size:12.5px}
.lk-group{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:10px}
.lk-gh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 4px;font-size:13px}
.lk-gh a{color:var(--primary);text-decoration:none;display:inline-flex;gap:4px;align-items:center;font-weight:600}
.lk-gh .ic{width:13px;height:13px}
.lk-sense{display:grid;grid-template-columns:20px 1fr;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px;cursor:pointer;font-size:14.5px;line-height:1.45}
.lk-sense:hover{background:var(--surface-2)}
.lk-sense.on{background:var(--primary-soft);border-color:var(--primary)}
.lk-sense .lk-radio .ic{width:17px;height:17px;color:var(--muted);margin-top:1px}
.lk-sense.on .lk-radio .ic{color:var(--primary)}
.lk-sense em{font-style:normal;font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.lk-sense small{display:block;color:var(--text-2);font-style:italic;margin-top:3px}
.lk-chips{display:flex;flex-wrap:wrap;gap:6px}
.lk-chips span,.lk-chips button{font-size:13.5px;padding:4px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--border)}
.lk-chips button{cursor:pointer}
.lk-chips button:hover{border-color:var(--primary);background:var(--primary-soft)}
.lk-vi{margin-bottom:8px}
.lk-vi>small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.lk-srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lk-srcs li{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;align-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:8px 10px}
.lk-srcs li .ic{width:16px;height:16px}
.lk-srcs li span small{color:var(--muted);margin-left:4px}
.lk-srcs li>small{grid-column:2;color:var(--text-2);font-size:12.5px}
.lk-srcs li.ok .ic{color:var(--green)}.lk-srcs li.warn .ic{color:var(--amber)}.lk-srcs li.no .ic,.lk-srcs li.off .ic{color:var(--muted)}
.lk-raw{margin-top:8px;font-size:12.5px}
.lk-raw pre{white-space:pre-wrap;word-break:break-all;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;max-height:160px;overflow:auto}
.lk-verify{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:13.5px}
.lk-verify>span{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-weight:600;width:100%}
.lk-verify>span .ic{width:15px;height:15px;color:var(--green)}
.lk-verify a{color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:600}
.lk-verify a .ic{width:13px;height:13px}
.fld input.auto,.fld textarea.auto{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.auto-note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);margin:0}
.auto-note .ic{width:15px;height:15px;color:var(--primary)}
details.more{border:1px solid var(--border);border-radius:14px;padding:12px 14px}
details.more>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{width:16px;height:16px}
details.more[open]>summary{margin-bottom:12px}
details.more .fld+.fld,details.more .grid2+.fld{margin-top:12px}
.warn .ic{width:14px;height:14px;vertical-align:-2px}
.ipa .acc{font:650 10.5px var(--f-ui);letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:2px}
.pick span .ic{width:14px;height:14px}
.seg label span .ic{width:14px;height:14px}
#item-save:disabled{opacity:.5}
@media (max-width:900px){.lk-body{grid-template-columns:minmax(0,1fr)}.lk-res{position:static;max-height:none}.lk{padding:18px 16px 4px}.lk-fields{grid-template-columns:1fr}}


/* IELTS target (personal goal) */
.tgoal{border:1.5px dashed color-mix(in srgb,var(--primary) 45%,var(--border));background:var(--primary-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.tg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tg-h>span{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--primary-ink)}
.tg-h .ic{width:16px;height:16px}
.tg-h em{font-style:normal;font-size:12px;color:var(--primary-ink);opacity:.75}
.tg-h .link{font-size:13px}
.tg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
.tg-cell>span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.tg-cell>span .ic{width:13px;height:13px}
.tg-cell b{font:750 18px/1.35 var(--f-ui);color:var(--primary-ink)}
.tg-cell i{font-style:normal;font-size:13px;white-space:nowrap;color:var(--muted);border-bottom:1px dashed var(--border-strong);line-height:1.6}
.tg-cell.ov{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 12px}
.tg-cell.ov>span{font-size:13px;color:var(--text-2);font-weight:600}
.tg-cell select{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:3px 4px;font-size:14px;font-weight:600;text-align:center}
.tg-cell.ov>span.tg-ov{flex-direction:column;align-items:flex-end;gap:0;font-weight:400}
.tg-cell.ov .tg-auto{white-space:nowrap}
.tg-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}


/* sign-in screen (website only) */
body.auth-open .app{visibility:hidden}
#auth{position:fixed;inset:0;z-index:200;background:#22195a;overflow:auto}
.auth-sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.auth-in{position:relative;min-height:100%;display:grid;place-items:center;padding:24px}
.auth-card{width:min(400px,100%);position:relative;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid color-mix(in srgb,#fff 45%,transparent);border-radius:22px;padding:28px 28px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 24px 60px -18px rgba(20,8,60,.55),0 0 0 1px rgba(40,20,90,.06)}
[data-theme=dark] .auth-card{background:color-mix(in srgb,var(--surface) 74%,transparent);border-color:rgba(200,185,255,.22);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 24px 60px -18px rgba(0,0,0,.7)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.auth-card{background:var(--surface)}}
.auth-alt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:0;background:none;color:var(--primary);font:600 14px var(--f-ui);padding:9px;border-radius:10px;cursor:pointer}
.auth-alt:hover{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.auth-alt .ic{width:16px;height:16px}
.auth-help{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin:12px 0 0;font-size:13px;color:var(--muted)}
.auth-help .link{font-size:13px;color:var(--text-2)}
.auth-foot{margin:18px -28px 0;padding:14px 28px;border-top:1px solid color-mix(in srgb,var(--border) 80%,transparent);text-align:center;font-size:14px;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) 45%,transparent);border-radius:0 0 22px 22px}
.auth-foot .link{font-size:14px;font-weight:650;display:inline-flex;align-items:center;gap:4px}.auth-foot .ic{width:15px;height:15px}
.auth-card>:last-child:not(.auth-foot){margin-bottom:24px}
@media (max-width:520px){.auth-in{padding:16px;align-items:start;padding-top:max(16px,8vh)}.auth-card{padding:22px 20px 0}.auth-foot{margin:16px -20px 0;padding:13px 20px}}
.auth-brand{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--f-ui);letter-spacing:-.025em;margin-bottom:22px}
.auth-card h1{font:750 22px/1.25 var(--f-ui);letter-spacing:-.02em;margin:0 0 6px}
.auth-card>p{margin:0 0 18px;font-size:14.5px}
#auth-form{display:flex;flex-direction:column;gap:14px}
#auth-form .btn{margin-top:4px}
.auth-msg{margin:0;font-size:14px;padding:9px 12px;border-radius:10px}
.auth-msg.ok{background:var(--primary-soft);color:var(--primary-ink)}
.auth-msg.err{background:color-mix(in srgb,#E5484D 12%,var(--surface));color:var(--text)}


/* ---------- Add vocabulary (one column, lookup as you type) */
.modal.av{max-width:760px;display:flex;flex-direction:column;max-height:calc(100vh - 12vh);max-height:calc(100dvh - 12vh);overflow:hidden}
.av-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 0}
.av-head h3{font:750 21px var(--f-ui);letter-spacing:-.02em;margin:0}
.av-body{flex:1;min-height:0;overflow-y:auto;padding:14px 22px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.av-q{display:flex;flex-direction:column;gap:8px}
.av-term{position:relative;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px}

.av-status{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;color:var(--muted);min-height:20px}
.av-status .ic{width:15px;height:15px;flex:none;margin-top:2px}
.av-status.done .ic{color:var(--green,#1f9d55)}

.av-dup:empty{display:none}

.av-dup .lk-dup-a{grid-column:auto;margin:0}
.av #dup{display:none !important}
.av-res:empty{display:none}
.av-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.av-h b{font-size:14px}.av-h small{color:var(--muted);font-size:12.5px}
.av-senses{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.av-sense{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;padding:10px 12px;background:var(--surface);border:0;border-top:1px solid var(--border);font:inherit;color:var(--text);cursor:pointer;font-size:14.5px;line-height:1.45}
.av-sense:first-child{border-top:0}
.av-sense:hover{background:var(--surface-2)}
.av-sense.on{background:var(--primary-soft)}
.av-sense .lk-radio .ic{width:17px;height:17px;color:var(--muted);margin-top:2px}
.av-sense.on .lk-radio .ic{color:var(--primary)}
.av-sd em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--primary-ink);background:color-mix(in srgb,var(--primary) 10%,transparent);padding:1px 6px;border-radius:5px;margin-right:2px}
.av-sd small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.av-tag{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:3px}
.av-more{margin-top:8px;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.av-core{display:flex;flex-direction:column;gap:12px}
.av .fld>span,.av .fld>label>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--text-2)}
.av .fld input,.av .fld textarea,.av .fld select{padding:9px 12px}
.av-src{font-size:11.5px;font-weight:500;color:var(--muted)}
.av-src.ok{color:var(--primary-ink)}

.av-src:empty{display:none}
.av-kbd{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--primary-ink);font:600 12px var(--f-ui);cursor:pointer;padding:0}
.av-kbd .ic{width:14px;height:14px}
.av .ipakeys{margin-top:-4px}
.av-chips{display:flex;flex-wrap:wrap;gap:5px}
.av-chips:empty{display:none}
.av-chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 9px;font:500 12.5px var(--f-ui);color:var(--text-2);cursor:pointer}
.av-chips button:hover{border-color:var(--primary);color:var(--primary-ink)}
.av-sec{border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.av-sec>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;font-size:14px}
.av-sec>summary::-webkit-details-marker{display:none}
.av-sec>summary>.ic{width:16px;height:16px;color:var(--muted);flex:none}
.av-sec>summary>span{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.av-sec>summary .av-chev{margin-left:auto;transition:transform .15s}

.av-foot .chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--text-2)}
.av-sp{flex:1}
@media (max-width:640px){.av-head{padding:14px 16px 0}.av-body{padding:12px 16px 16px}.av-foot{padding:10px 16px}.av-sense{grid-template-columns:20px minmax(0,1fr)}.av-tag{grid-column:2;margin:0}.av-dup .lk-dup{grid-template-columns:20px 1fr}.av-dup .lk-dup-a{grid-column:2}}


.tg-ov{display:flex;align-items:baseline;gap:8px}
.tg-ov-v{font:750 18px/1.35 var(--f-ui);color:var(--primary-ink)}
.tg-auto{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}

.ob-cell select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 8px;font:650 15px var(--f-ui);color:var(--text)}
.ob-ov{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed color-mix(in srgb,var(--primary) 45%,var(--border));background:var(--primary-soft);border-radius:12px;padding:10px 14px;text-align:left}

/* grammar + structure libraries */
.tgroup{margin-bottom:22px}
